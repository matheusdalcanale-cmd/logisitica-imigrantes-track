<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiTrack Pro - Gestão Logística</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex overflow-hidden">

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-xl w-96">
            <h2 class="text-2xl font-bold mb-6 text-center text-blue-600"><i class="fas fa-truck-fast mr-2"></i>LogiTrack</h2>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">E-mail</label>
                    <input type="email" id="auth-email" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Senha</label>
                    <input type="password" id="auth-password" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
                </div>
                <div class="text-red-500 text-sm hidden" id="auth-error"></div>
                <button type="submit" id="btn-login" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 transition">Entrar / Cadastrar</button>
                <p class="text-xs text-gray-500 text-center mt-4">Se o e-mail não existir, uma nova conta será criada automaticamente.</p>
            </form>
        </div>
    </div>

    <!-- SIDEBAR / FORMULÁRIO DE CRIAÇÃO -->
    <aside class="w-80 bg-white shadow-xl flex flex-col h-full border-r border-gray-200 hidden" id="sidebar">
        <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-blue-600 text-white">
            <h1 class="text-xl font-bold"><i class="fas fa-truck-fast mr-2"></i>LogiTrack</h1>
            <button id="btn-logout" class="text-white hover:text-gray-200 text-sm"><i class="fas fa-sign-out-alt"></i> Sair</button>
        </div>
        
        <div class="p-6 overflow-y-auto flex-1">
            <h2 class="text-lg font-bold mb-4 text-gray-700">Novo Processo</h2>
            
            <div class="flex gap-2 mb-6">
                <button id="btn-type-import" class="flex-1 py-2 text-sm font-semibold rounded bg-blue-100 text-blue-700 border border-blue-300 transition">Importação</button>
                <button id="btn-type-export" class="flex-1 py-2 text-sm font-semibold rounded bg-gray-100 text-gray-600 border border-gray-300 transition">Exportação</button>
            </div>

            <form id="process-form" class="space-y-4">
                <input type="hidden" id="process-type" value="import">
                
                <!-- Campos Comuns -->
                <div id="fields-common">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Armador</label>
                    <input type="text" id="f-armador" class="w-full p-2 text-sm border rounded bg-gray-50 focus:bg-white" required>
                </div>

                <!-- Campos Importação -->
                <div id="fields-import" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Importador</label>
                        <input type="text" id="f-importador" class="w-full p-2 text-sm border rounded bg-gray-50 focus:bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">DI / DTA / DUIMP</label>
                        <input type="text" id="f-documento" class="w-full p-2 text-sm border rounded bg-gray-50 focus:bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Terminal de Carregamento</label>
                        <input type="text" id="f-term-carga" class="w-full p-2 text-sm border rounded bg-gray-50 focus:bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Terminal de Vazio</label>
                        <input type="text" id="f-term-vazio" class="w-full p-2 text-sm border rounded bg-gray-50 focus:bg-white">
                    </div>
                </div>

                <!-- Campos Exportação -->
                <div id="fields-export" class="space-y-4 hidden">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Exportador</label>
                        <input type="text" id="f-exportador" class="w-full p-2 text-sm border rounded bg-gray-50 focus:bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Referência do Processo</label>
                        <input type="text" id="f-referencia" class="w-full p-2 text-sm border rounded bg-gray-50 focus:bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Número do Booking</label>
                        <input type="text" id="f-booking" class="w-full p-2 text-sm border rounded bg-gray-50 focus:bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Nome do Navio</label>
                        <input type="text" id="f-navio" class="w-full p-2 text-sm border rounded bg-gray-50 focus:bg-white">
                    </div>
                </div>

                <div class="border-t pt-4 mt-4">
                    <h3 class="text-sm font-bold text-gray-700 mb-2 flex justify-between items-center">
                        Contêineres
                        <button type="button" id="btn-add-container" class="text-blue-600 hover:text-blue-800 text-xs"><i class="fas fa-plus"></i> Adicionar</button>
                    </h3>
                    <div id="container-list" class="space-y-3">
                        <!-- Containers inseridos dinamicamente -->
                    </div>
                </div>

                <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded mt-6 hover:bg-green-700 shadow-md">Criar Processo</button>
            </form>
        </div>
    </aside>

    <!-- PAINEL PRINCIPAL -->
    <main class="flex-1 flex flex-col h-full bg-gray-50 hidden" id="main-panel">
        <header class="bg-white shadow-sm border-b px-8 py-4 flex items-center justify-between">
            <div class="flex gap-4">
                <button id="tab-import" class="px-4 py-2 font-bold text-blue-700 border-b-2 border-blue-700">Importações Ativas</button>
                <button id="tab-export" class="px-4 py-2 font-bold text-gray-500 hover:text-blue-700">Exportações Ativas</button>
                <button id="tab-archive" class="px-4 py-2 font-bold text-gray-500 hover:text-blue-700">Arquivados</button>
            </div>
            <div class="text-sm text-gray-500" id="user-display"></div>
        </header>

        <div class="flex-1 p-8 overflow-y-auto">
            <div id="processes-container" class="space-y-3">
                <!-- Cartões de processos -->
            </div>
        </div>
    </main>

    <!-- MODAL DE DETALHES -->
    <div id="process-modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="bg-gray-100 p-4 border-b flex justify-between items-start">
                <div>
                    <div class="flex gap-2 items-center mb-1">
                        <span id="m-type-badge" class="px-2 py-1 text-xs font-bold rounded bg-blue-100 text-blue-800 uppercase"></span>
                        <h2 id="m-title" class="text-xl font-bold text-gray-800"></h2>
                    </div>
                    <p id="m-subtitle" class="text-sm text-gray-600"></p>
                </div>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 text-2xl">&times;</button>
            </div>
            
            <!-- Alerta Embraport -->
            <div id="m-embraport-alert" class="hidden bg-yellow-50 border-l-4 border-yellow-400 p-4">
                <div class="flex">
                    <div class="flex-shrink-0"><i class="fas fa-exclamation-triangle text-yellow-400"></i></div>
                    <div class="ml-3">
                        <p class="text-sm text-yellow-700 font-bold">Atenção: Operação Embraport detectada.</p>
                        <p class="text-xs text-yellow-600">Janelas para DTA liberadas com 24h a no máximo 48h de antecedência. Monitore o agendamento.</p>
                    </div>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-6 bg-gray-50" id="m-containers-area">
                <!-- Conteúdo gerado dinamicamente -->
            </div>

            <div class="p-4 border-t bg-white flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 text-gray-600 font-semibold hover:bg-gray-100 rounded">Fechar</button>
                <button id="btn-archive-process" class="px-6 py-2 bg-green-600 text-white font-bold rounded shadow hover:bg-green-700 hidden">Arquivar Processo</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs e Lógica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CONFIGURAÇÃO DO FIREBASE FORNECIDA
        const firebaseConfig = {
            apiKey: "AIzaSyAKGjOftcyDZ-5yPA-5NK55GohtGlrfbeQ",
            authDomain: "track-logistica.firebaseapp.com",
            projectId: "track-logistica",
            storageBucket: "track-logistica.firebasestorage.app",
            messagingSenderId: "986198520521",
            appId: "1:986198520521:web:a4c088bc7c4e773156d318"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentActiveTab = 'import'; // import, export, archive
        let processes = [];
        let currentViewingProcessId = null;

        // ELEMENTOS UI
        const loginScreen = document.getElementById('login-screen');
        const sidebar = document.getElementById('sidebar');
        const mainPanel = document.getElementById('main-panel');
        
        // CHECKLIST ORDER (Conforme solicitado)
        const importChecklistSteps = [
            { id: 'ag_carga', label: 'Agendamento de Carregamento', type: 'datetime' },
            { id: 'ag_vazio', label: 'Agendamento de Vazio', type: 'datetime' },
            { id: 'gerar_cte', label: 'Gerar CTE', type: 'checkbox' },
            { id: 'gerar_ciot', label: 'Gerar CIOT', type: 'checkbox' },
            { id: 'gerar_mdfe', label: 'Gerar MDFE', type: 'checkbox' },
            { id: 'encerrar_mdfe', label: 'Encerrar MDFE', type: 'checkbox' }
        ];

        // AUTENTICAÇÃO
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loginScreen.classList.add('hidden');
                sidebar.classList.remove('hidden');
                mainPanel.classList.remove('hidden');
                document.getElementById('user-display').innerText = user.email;
                loadProcesses();
            } else {
                currentUser = null;
                loginScreen.classList.remove('hidden');
                sidebar.classList.add('hidden');
                mainPanel.classList.add('hidden');
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value; // Valor lido sem restrições
            const errorDiv = document.getElementById('auth-error');
            
            try {
                await signInWithEmailAndPassword(auth, email, password);
                errorDiv.classList.add('hidden');
            } catch (error) {
                if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                    try {
                        await createUserWithEmailAndPassword(auth, email, password);
                        errorDiv.classList.add('hidden');
                    } catch (createError) {
                        errorDiv.innerText = "Erro ao criar conta: " + createError.message;
                        errorDiv.classList.remove('hidden');
                    }
                } else {
                    errorDiv.innerText = "Erro no login: " + error.message;
                    errorDiv.classList.remove('hidden');
                }
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

        // ALTERNAR ABAS E TIPOS
        const setFormType = (type) => {
            document.getElementById('process-type').value = type;
            const btnImport = document.getElementById('btn-type-import');
            const btnExport = document.getElementById('btn-type-export');
            const fImport = document.getElementById('fields-import');
            const fExport = document.getElementById('fields-export');
            
            document.getElementById('container-list').innerHTML = '';
            addContainerField(type);

            if (type === 'import') {
                btnImport.className = 'flex-1 py-2 text-sm font-semibold rounded bg-blue-100 text-blue-700 border border-blue-300 transition';
                btnExport.className = 'flex-1 py-2 text-sm font-semibold rounded bg-gray-100 text-gray-600 border border-gray-300 transition';
                fImport.classList.remove('hidden');
                fExport.classList.add('hidden');
            } else {
                btnExport.className = 'flex-1 py-2 text-sm font-semibold rounded bg-blue-100 text-blue-700 border border-blue-300 transition';
                btnImport.className = 'flex-1 py-2 text-sm font-semibold rounded bg-gray-100 text-gray-600 border border-gray-300 transition';
                fExport.classList.remove('hidden');
                fImport.classList.add('hidden');
            }
        };

        document.getElementById('btn-type-import').addEventListener('click', () => setFormType('import'));
        document.getElementById('btn-type-export').addEventListener('click', () => setFormType('export'));

        const setMainTab = (tab) => {
            currentActiveTab = tab;
            const tabs = {
                'import': document.getElementById('tab-import'),
                'export': document.getElementById('tab-export'),
                'archive': document.getElementById('tab-archive')
            };
            
            Object.values(tabs).forEach(t => t.className = 'px-4 py-2 font-bold text-gray-500 hover:text-blue-700');
            if(tab === 'archive') {
                tabs[tab].className = 'px-4 py-2 font-bold text-green-700 border-b-2 border-green-700';
            } else {
                tabs[tab].className = 'px-4 py-2 font-bold text-blue-700 border-b-2 border-blue-700';
            }
            renderProcesses();
        };

        document.getElementById('tab-import').addEventListener('click', () => setMainTab('import'));
        document.getElementById('tab-export').addEventListener('click', () => setMainTab('export'));
        document.getElementById('tab-archive').addEventListener('click', () => setMainTab('archive'));

        // GESTÃO DE CONTAINERS NO FORMULÁRIO
        let containerCount = 0;
        const addContainerField = (type = document.getElementById('process-type').value) => {
            containerCount++;
            const div = document.createElement('div');
            div.className = 'bg-gray-100 p-3 rounded border border-gray-200 relative';
            div.id = `ct-form-${containerCount}`;
            
            let html = `
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold text-gray-600">Contêiner ${containerCount}</span>
                    ${containerCount > 1 ? `<button type="button" onclick="document.getElementById('ct-form-${containerCount}').remove()" class="text-red-500 text-xs"><i class="fas fa-trash"></i></button>` : ''}
                </div>
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <input type="text" placeholder="Numeração" class="ct-num w-full p-2 text-xs border rounded" required>
                    <input type="text" placeholder="Tipo (ex: 40HC)" class="ct-tipo w-full p-2 text-xs border rounded" required>
                </div>`;
                
            if(type === 'export') {
                html += `
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" placeholder="Tara" class="ct-tara w-full p-2 text-xs border rounded">
                    <input type="text" placeholder="Lacre" class="ct-lacre w-full p-2 text-xs border rounded">
                </div>`;
            }
            
            div.innerHTML = html;
            document.getElementById('container-list').appendChild(div);
        };
        
        document.getElementById('btn-add-container').addEventListener('click', () => addContainerField());
        addContainerField('import'); // Init

        // SALVAR NOVO PROCESSO
        document.getElementById('process-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const type = document.getElementById('process-type').value;
            
            let processData = {
                userId: currentUser.uid,
                type: type,
                status: 'active',
                createdAt: new Date().toISOString(),
                armador: document.getElementById('f-armador').value,
                containers: []
            };

            if (type === 'import') {
                processData.importador = document.getElementById('f-importador').value;
                processData.documento = document.getElementById('f-documento').value;
                processData.termCarga = document.getElementById('f-term-carga').value;
                processData.termVazio = document.getElementById('f-term-vazio').value;
            } else {
                processData.exportador = document.getElementById('f-exportador').value;
                processData.referencia = document.getElementById('f-referencia').value;
                processData.booking = document.getElementById('f-booking').value;
                processData.navio = document.getElementById('f-navio').value;
            }

            const ctForms = document.querySelectorAll('#container-list > div');
            ctForms.forEach((ctDiv, index) => {
                let ct = {
                    id: `c_${Date.now()}_${index}`,
                    numero: ctDiv.querySelector('.ct-num').value,
                    tipo: ctDiv.querySelector('.ct-tipo').value,
                    checklist: {} 
                };
                
                if (type === 'import') {
                    importChecklistSteps.forEach(step => ct.checklist[step.id] = '');
                } else {
                    ct.tara = ctDiv.querySelector('.ct-tara').value;
                    ct.lacre = ctDiv.querySelector('.ct-lacre').value;
                    ct.deadlineDraft = '';
                    ct.deadlineCarga = '';
                    ct.agVazio = '';
                    ct.termVazioExp = '';
                    ct.agCheio = '';
                    ct.termCheioExp = '';
                }
                processData.containers.push(ct);
            });

            try {
                const docRef = await addDoc(collection(db, "processes"), processData);
                document.getElementById('process-form').reset();
                document.getElementById('container-list').innerHTML = '';
                containerCount = 0;
                addContainerField(type);
                setMainTab(type);
            } catch (error) {
                console.error("Erro ao salvar:", error);
                alert("Erro ao criar processo.");
            }
        });

        // LER DO FIREBASE
        const loadProcesses = () => {
            const q = query(collection(db, "processes"), where("userId", "==", currentUser.uid));
            onSnapshot(q, (snapshot) => {
                processes = [];
                snapshot.forEach((doc) => {
                    processes.push({ id: doc.id, ...doc.data() });
                });
                renderProcesses();
                
                if(currentViewingProcessId) {
                    const updatedData = processes.find(p => p.id === currentViewingProcessId);
                    if(updatedData) openModal(currentViewingProcessId);
                }
            });
        };

        // RENDERIZAR CARTÕES
        const renderProcesses = () => {
            const container = document.getElementById('processes-container');
            container.innerHTML = '';
            
            let filtered = processes.filter(p => {
                if(currentActiveTab === 'archive') return p.status === 'archived';
                if(currentActiveTab === 'import') return p.status === 'active' && p.type === 'import';
                if(currentActiveTab === 'export') return p.status === 'active' && p.type === 'export';
                return false;
            });

            if(filtered.length === 0) {
                container.innerHTML = `<div class="text-center p-8 text-gray-400">Nenhum processo encontrado nesta categoria.</div>`;
                return;
            }

            filtered.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).forEach(proc => {
                const title = proc.type === 'import' ? proc.importador : proc.exportador;
                const docRef = proc.type === 'import' ? proc.documento : proc.booking;
                const badges = proc.containers.map(c => `<span class="bg-gray-200 text-xs px-2 py-1 rounded">${c.numero}</span>`).join(' ');

                const embraportAlert = (proc.termCarga && proc.termCarga.toLowerCase().includes('embraport')) || 
                                       (proc.containers.some(c => c.termCheioExp && c.termCheioExp.toLowerCase().includes('embraport')))
                                       ? `<i class="fas fa-exclamation-triangle text-yellow-500 ml-2" title="Alerta Embraport"></i>` : '';

                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-lg shadow border border-gray-100 flex items-center justify-between cursor-pointer hover:border-blue-300 hover:shadow-md transition";
                card.onclick = () => openModal(proc.id);
                
                card.innerHTML = `
                    <div class="flex items-center gap-6 w-full">
                        <div class="w-1/4">
                            <div class="text-xs text-gray-500 font-semibold uppercase">${proc.type === 'import' ? 'Importação' : 'Exportação'} ${embraportAlert}</div>
                            <div class="font-bold text-gray-800 truncate">${title || 'N/A'}</div>
                            <div class="text-xs text-gray-500">${proc.armador || ''}</div>
                        </div>
                        <div class="w-1/4">
                            <div class="text-xs text-gray-500 font-semibold">Ref / Doc</div>
                            <div class="font-bold text-gray-700">${docRef || 'N/A'}</div>
                        </div>
                        <div class="w-2/4 flex flex-col items-end">
                            <div class="text-xs text-gray-500 font-semibold mb-1">${proc.containers.length} Contêiner(es)</div>
                            <div class="flex flex-wrap gap-1 justify-end">${badges}</div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        };

        // MODAL DE DETALHES E CHECKLIST
        window.openModal = (id) => {
            currentViewingProcessId = id;
            const proc = processes.find(p => p.id === id);
            if(!proc) return;

            document.getElementById('process-modal').classList.remove('hidden');
            document.getElementById('process-modal').classList.add('flex');
            
            const badge = document.getElementById('m-type-badge');
            const title = document.getElementById('m-title');
            const subtitle = document.getElementById('m-subtitle');
            const alertBox = document.getElementById('m-embraport-alert');
            const btnArchive = document.getElementById('btn-archive-process');
            const ctArea = document.getElementById('m-containers-area');

            badge.innerText = proc.type;
            if(proc.type === 'import') {
                title.innerText = proc.importador || 'Processo de Importação';
                subtitle.innerText = `Doc: ${proc.documento} | Armador: ${proc.armador} | Carga: ${proc.termCarga} | Vazio: ${proc.termVazio}`;
            } else {
                title.innerText = proc.exportador || 'Processo de Exportação';
                subtitle.innerText = `Booking: ${proc.booking} | Ref: ${proc.referencia} | Navio: ${proc.navio}`;
            }

            // Exibir alerta embraport
            let hasEmbraport = false;
            if(proc.type === 'import' && proc.termCarga && proc.termCarga.toLowerCase().includes('embraport')) hasEmbraport = true;
            if(proc.type === 'export' && proc.containers.some(c => c.termCheioExp && c.termCheioExp.toLowerCase().includes('embraport'))) hasEmbraport = true;
            
            if(hasEmbraport) alertBox.classList.remove('hidden');
            else alertBox.classList.add('hidden');

            ctArea.innerHTML = '';
            
            proc.containers.forEach((ct, index) => {
                const ctBlock = document.createElement('div');
                ctBlock.className = "bg-white p-4 rounded shadow-sm border mb-4";
                
                let ctHeader = `<div class="border-b pb-2 mb-3"><h4 class="font-bold text-gray-800">Contêiner: ${ct.numero} <span class="text-xs text-gray-500 font-normal ml-2">(${ct.tipo})</span></h4>`;
                
                if(proc.type === 'export') {
                    ctHeader += `<div class="text-xs text-gray-600 mt-1">Tara: ${ct.tara || '-'} | Lacre: ${ct.lacre || '-'}</div>`;
                }
                ctHeader += `</div>`;
                
                let ctBody = '';
                if(proc.type === 'import') {
                    ctBody = `<div class="space-y-2">`;
                    importChecklistSteps.forEach(step => {
                        const val = ct.checklist[step.id] || '';
                        if(step.type === 'checkbox') {
                            const checked = val === 'true' ? 'checked' : '';
                            ctBody += `
                            <label class="flex items-center gap-2 text-sm text-gray-700 hover:bg-gray-50 p-1 rounded cursor-pointer">
                                <input type="checkbox" onchange="updateChecklist('${proc.id}', '${ct.id}', '${step.id}', this.checked)" ${checked} ${proc.status === 'archived' ? 'disabled' : ''} class="w-4 h-4 text-blue-600">
                                ${step.label}
                            </label>`;
                        } else if(step.type === 'datetime') {
                            ctBody += `
                            <div class="flex items-center justify-between text-sm text-gray-700 bg-gray-50 p-2 rounded">
                                <span>${step.label}</span>
                                <input type="datetime-local" value="${val}" onchange="updateChecklist('${proc.id}', '${ct.id}', '${step.id}', this.value)" ${proc.status === 'archived' ? 'disabled' : ''} class="border rounded p-1 text-xs w-48">
                            </div>`;
                        }
                    });
                    ctBody += `</div>`;
                } else {
                    // Export Checklist/Deadlines
                    ctBody = `
                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600">Deadline Draft</label>
                            <input type="datetime-local" value="${ct.deadlineDraft || ''}" onchange="updateField('${proc.id}', '${ct.id}', 'deadlineDraft', this.value)" ${proc.status === 'archived' ? 'disabled' : ''} class="w-full border rounded p-1 text-xs mt-1">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600">Deadline Carga</label>
                            <input type="datetime-local" value="${ct.deadlineCarga || ''}" onchange="updateField('${proc.id}', '${ct.id}', 'deadlineCarga', this.value)" ${proc.status === 'archived' ? 'disabled' : ''} class="w-full border rounded p-1 text-xs mt-1">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600">Retirada Vazio (Terminal / Data)</label>
                            <div class="flex gap-1 mt-1">
                                <input type="text" placeholder="Terminal" value="${ct.termVazioExp || ''}" onchange="updateField('${proc.id}', '${ct.id}', 'termVazioExp', this.value)" ${proc.status === 'archived' ? 'disabled' : ''} class="w-1/2 border rounded p-1 text-xs">
                                <input type="datetime-local" value="${ct.agVazio || ''}" onchange="updateField('${proc.id}', '${ct.id}', 'agVazio', this.value)" ${proc.status === 'archived' ? 'disabled' : ''} class="w-1/2 border rounded p-1 text-xs">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600">Depósito Cheio (Terminal / Data)</label>
                            <div class="flex gap-1 mt-1">
                                <input type="text" placeholder="Terminal" value="${ct.termCheioExp || ''}" onchange="updateField('${proc.id}', '${ct.id}', 'termCheioExp', this.value)" ${proc.status === 'archived' ? 'disabled' : ''} class="w-1/2 border rounded p-1 text-xs">
                                <input type="datetime-local" value="${ct.agCheio || ''}" onchange="updateField('${proc.id}', '${ct.id}', 'agCheio', this.value)" ${proc.status === 'archived' ? 'disabled' : ''} class="w-1/2 border rounded p-1 text-xs">
                            </div>
                        </div>
                    </div>`;
                }
                
                ctBlock.innerHTML = ctHeader + ctBody;
                ctArea.appendChild(ctBlock);
            });

            if(proc.status === 'active') {
                btnArchive.classList.remove('hidden');
                btnArchive.onclick = () => archiveProcess(proc.id);
            } else {
                btnArchive.classList.add('hidden');
            }
        };

        window.closeModal = () => {
            currentViewingProcessId = null;
            document.getElementById('process-modal').classList.add('hidden');
            document.getElementById('process-modal').classList.remove('flex');
        };

        window.updateChecklist = async (procId, ctId, fieldId, value) => {
            const proc = processes.find(p => p.id === procId);
            const ctIndex = proc.containers.findIndex(c => c.id === ctId);
            const ref = doc(db, "processes", procId);
            proc.containers[ctIndex].checklist[fieldId] = value.toString();
            await updateDoc(ref, { containers: proc.containers });
        };

        window.updateField = async (procId, ctId, field, value) => {
            const proc = processes.find(p => p.id === procId);
            const ctIndex = proc.containers.findIndex(c => c.id === ctId);
            const ref = doc(db, "processes", procId);
            proc.containers[ctIndex][field] = value;
            await updateDoc(ref, { containers: proc.containers });
        };

        window.archiveProcess = async (procId) => {
            if(confirm("Tem certeza que deseja mover este processo para Arquivados?")) {
                const ref = doc(db, "processes", procId);
                await updateDoc(ref, { status: 'archived' });
                closeModal();
            }
        };
    </script>
</body>
</html>
