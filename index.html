<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiTrack Pro - Gestão Logística</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen antialiased">

    <!-- TELA DE LOGIN / AUTENTICAÇÃO -->
    <div id="auth-screen" class="fixed inset-0 bg-slate-950 flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-600/20 text-blue-400 text-2xl mb-4">
                    <i class="fa-solid fa-boxes-stacked"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight">LogiTrack Pro</h1>
                <p class="text-slate-400 text-sm mt-1">Gestão Inteligente de Importação & Exportação</p>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">E-mail</label>
                    <input type="email" id="auth-email" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Senha (mínimo 6 caracteres)</label>
                    <input type="password" id="auth-password" required minlength="6" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition-colors text-sm">
                    Entrar no Sistema
                </button>
            </form>

            <div class="text-center mt-6">
                <button onclick="toggleAuthMode()" type="button" id="auth-toggle-btn" class="text-xs text-blue-400 hover:underline">
                    Não tem uma conta? Crie uma agora
                </button>
            </div>
            <div id="auth-error" class="mt-4 text-center text-xs text-red-400 hidden"></div>
        </div>
    </div>

    <!-- APLICAÇÃO PRINCIPAL -->
    <div id="app-screen" class="hidden flex h-screen overflow-hidden">
        
        <!-- SIDEBAR DE CADASTRO -->
        <aside class="w-96 bg-slate-950 border-r border-slate-800 flex flex-col z-10">
            <div class="p-5 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-blue-600/20 text-blue-400 flex items-center justify-center">
                        <i class="fa-solid fa-route"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-sm">Painel Operacional</h2>
                        <span id="user-display-email" class="text-xs text-slate-400 truncate block w-48"></span>
                    </div>
                </div>
                <button onclick="logout()" title="Sair" class="text-slate-400 hover:text-red-400 transition-colors p-2">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>

            <!-- TIPO DE OPERAÇÃO -->
            <div class="p-4 border-b border-slate-800 bg-slate-900/50">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Tipo de Operação</label>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="switchOperationType('import')" id="btn-type-import" class="py-2 px-3 rounded-lg text-xs font-medium bg-blue-600 text-white transition-colors">
                        Importação
                    </button>
                    <button type="button" onclick="switchOperationType('export')" id="btn-type-export" class="py-2 px-3 rounded-lg text-xs font-medium bg-slate-800 text-slate-400 hover:bg-slate-700 transition-colors">
                        Exportação
                    </button>
                </div>
            </div>

            <!-- FORMULÁRIO -->
            <div class="flex-1 overflow-y-auto p-4 space-y-4">
                <form id="process-form" onsubmit="saveProcess(event)" class="space-y-3.5">
                    
                    <!-- CAMPOS IMPORTAÇÃO -->
                    <div id="fields-import" class="space-y-3.5">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Importador</label>
                            <input type="text" id="imp-importador" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Nº DI / DTA / DUIMP</label>
                            <input type="text" id="imp-doc" required class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Armador</label>
                            <input type="text" id="imp-armador" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1">Terminal Carga</label>
                                <input type="text" id="imp-term-carga" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1">Terminal Vazio</label>
                                <input type="text" id="imp-term-vazio" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
                            </div>
                        </div>
                    </div>

                    <!-- CAMPOS EXPORTAÇÃO -->
                    <div id="fields-export" class="space-y-3.5 hidden">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Exportador</label>
                            <input type="text" id="exp-exportador" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Referência do Processo</label>
                            <input type="text" id="exp-ref" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1">Armador</label>
                                <input type="text" id="exp-armador" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1">Nº Booking</label>
                                <input type="text" id="exp-booking" required class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Nome do Navio</label>
                            <input type="text" id="exp-navio" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1">Deadline Draft</label>
                                <input type="datetime-local" id="exp-dl-draft" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-2 text-[11px] text-slate-300 focus:outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1">Deadline Carga</label>
                                <input type="datetime-local" id="exp-dl-carga" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-2 text-[11px] text-slate-300 focus:outline-none focus:border-blue-500">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1">Retirada Vazio (Terminal / Agend.)</label>
                                <input type="text" id="exp-term-vazio-nome" placeholder="Terminal" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1.5 text-xs mb-1 focus:outline-none focus:border-blue-500">
                                <input type="datetime-local" id="exp-term-vazio-agenda" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-[11px] text-slate-300 focus:outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1">Depósito Cheio (Terminal / Agend.)</label>
                                <input type="text" id="exp-term-cheio-nome" placeholder="Terminal" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1.5 text-xs mb-1 focus:outline-none focus:border-blue-500">
                                <input type="datetime-local" id="exp-term-cheio-agenda" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-[11px] text-slate-300 focus:outline-none focus:border-blue-500">
                            </div>
                        </div>
                    </div>

                    <!-- CONTÊINERES DINÂMICOS (Apenas visível se for Importação) -->
                    <div id="container-section-wrapper" class="border-t border-slate-800 pt-3">
                        <div class="flex items-center justify-between mb-2">
                            <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Contêineres</label>
                            <button type="button" onclick="addContainerField()" class="text-xs text-blue-400 hover:underline"><i class="fa-solid fa-plus mr-1"></i>Adicionar</button>
                        </div>
                        <div id="containers-container" class="space-y-2">
                            <div class="container-row bg-slate-900 p-2.5 rounded-lg border border-slate-800 space-y-2">
                                <div class="flex gap-2">
                                    <input type="text" placeholder="Nº Contêiner" class="container-num flex-1 bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs uppercase">
                                    <select class="container-tipo w-24 bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs">
                                        <option value="20DRY">20DRY</option>
                                        <option value="40HC">40HC</option>
                                        <option value="40DRY">40DRY</option>
                                        <option value="40OT">40OT</option>
                                    </select>
                                    <button type="button" onclick="this.parentElement.parentElement.remove()" class="text-slate-500 hover:text-red-400 px-1"><i class="fa-solid fa-trash"></i></button>
                                </div>
                                <div class="container-export-extras hidden grid grid-cols-2 gap-2">
                                    <input type="text" placeholder="Tara (kg)" class="container-tara bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs">
                                    <input type="text" placeholder="Lacre" class="container-lacre bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs">
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg transition-colors text-xs shadow-lg mt-2">
                        <i class="fa-solid fa-check mr-1.5"></i> Cadastrar Processo
                    </button>
                </form>
            </div>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="flex-1 flex flex-col bg-slate-900 overflow-hidden">
            <!-- HEADER DE ABAS -->
            <header class="h-16 border-b border-slate-800 px-6 flex items-center justify-between bg-slate-950">
                <div class="flex items-center gap-3">
                    <button onclick="switchTab('import')" id="tab-btn-import" class="px-4 py-2 rounded-lg text-xs font-semibold bg-blue-600 text-white transition-colors">
                        <i class="fa-solid fa-ship mr-2"></i> Importações Ativas
                    </button>
                    <button onclick="switchTab('export')" id="tab-btn-export" class="px-4 py-2 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:bg-slate-700 transition-colors">
                        <i class="fa-solid fa-plane-departure mr-2"></i> Exportações Ativas
                    </button>
                    <button onclick="switchTab('archived')" id="tab-btn-archived" class="px-4 py-2 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:bg-slate-700 transition-colors">
                        <i class="fa-solid fa-box-archive mr-2"></i> Arquivados
                    </button>
                </div>
                <div class="text-xs text-slate-400">
                    Sistema Operacional Logístico
                </div>
            </header>

            <!-- PAINEL DOS CARDS -->
            <div class="flex-1 overflow-y-auto p-6">
                <div id="process-list" class="space-y-3">
                    <!-- Cards injetados via JS -->
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL DE DETALHES -->
    <div id="details-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-4xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-5 border-b border-slate-800 flex items-center justify-between bg-slate-950">
                <h3 id="modal-title" class="font-bold text-sm">Detalhes do Processo</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white p-2"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modal-content" class="p-6 overflow-y-auto flex-1 space-y-6">
                <!-- Conteúdo detalhado injetado via JS -->
            </div>
        </div>
    </div>

    <!-- SCRIPT DE CONFIGURAÇÃO E NEGÓCIO -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // CONFIGURAÇÃO DO FIREBASE (SUAS CREDENCIAIS)
        const firebaseConfig = {
            apiKey: "AIzaSyAKGjOftcyDZ-5yPA-5NK55GohtGlrfbeQ",
            authDomain: "track-logistica.firebaseapp.com",
            projectId: "track-logistica",
            storageBucket: "track-logistica.firebasestorage.app",
            messagingSenderId: "986198520521",
            appId: "1:986198520521:web:a4c088bc7c4e773156d318"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        let unsubscribeProcesses = null;

        let currentUser = null;
        let activeTab = 'import';
        let operationType = 'import';
        let processes = [];
        let currentModalProcessId = null;
        let isSignUpMode = false;

        window.toggleAuthMode = function() {
            isSignUpMode = !isSignUpMode;
            const btn = document.getElementById('auth-btn');
            const toggleBtn = document.getElementById('auth-toggle-btn');
            if (isSignUpMode) {
                btn.innerText = "Criar Conta";
                toggleBtn.innerText = "Já tem uma conta? Faça login";
            } else {
                btn.innerText = "Entrar no Sistema";
                toggleBtn.innerText = "Não tem uma conta? Crie uma agora";
            }
        };

        window.handleAuth = async function(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            const errDiv = document.getElementById('auth-error');
            errDiv.classList.add('hidden');

            const btn = document.getElementById('auth-btn');
            btn.disabled = true;
            btn.classList.add('opacity-60', 'cursor-not-allowed');

            try {
                if (isSignUpMode) {
                    await createUserWithEmailAndPassword(auth, email, pass);
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
            } catch (err) {
                const messages = {
                    'auth/invalid-credential': 'E-mail ou senha incorretos.',
                    'auth/email-already-in-use': 'Este e-mail já possui uma conta.',
                    'auth/invalid-email': 'Informe um e-mail válido.',
                    'auth/weak-password': 'A senha precisa ter pelo menos 6 caracteres.',
                    'auth/too-many-requests': 'Muitas tentativas. Aguarde um pouco e tente novamente.'
                };
                errDiv.innerText = messages[err.code] || 'Não foi possível concluir a autenticação.';
                errDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-60', 'cursor-not-allowed');
            }
        };

        window.logout = function() {
            if (unsubscribeProcesses) {
                unsubscribeProcesses();
                unsubscribeProcesses = null;
            }
            signOut(auth);
        };

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                document.getElementById('user-display-email').innerText = user.email;
                loadProcesses();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
            }
        });

        window.switchOperationType = function(type) {
            operationType = type;
            const btnImp = document.getElementById('btn-type-import');
            const btnExp = document.getElementById('btn-type-export');
            const fieldsImp = document.getElementById('fields-import');
            const fieldsExp = document.getElementById('fields-export');
            const containerWrapper = document.getElementById('container-section-wrapper');

            const containerRows = document.querySelectorAll('.container-row');
            if (type === 'import') {
                btnImp.className = "py-2 px-3 rounded-lg text-xs font-medium bg-blue-600 text-white transition-colors";
                btnExp.className = "py-2 px-3 rounded-lg text-xs font-medium bg-slate-800 text-slate-400 hover:bg-slate-700 transition-colors";
                fieldsImp.classList.remove('hidden');
                fieldsExp.classList.add('hidden');
                containerWrapper.classList.remove('hidden');
                containerRows.forEach(row => row.querySelector('.container-num')?.setAttribute('required', 'required'));
            } else {
                btnExp.className = "py-2 px-3 rounded-lg text-xs font-medium bg-blue-600 text-white transition-colors";
                btnImp.className = "py-2 px-3 rounded-lg text-xs font-medium bg-slate-800 text-slate-400 hover:bg-slate-700 transition-colors";
                fieldsExp.classList.remove('hidden');
                fieldsImp.classList.add('hidden');
                containerWrapper.classList.add('hidden');
                containerRows.forEach(row => row.querySelector('.container-num')?.removeAttribute('required'));
            }
        };

        window.switchTab = function(tab) {
            activeTab = tab;
            ['import', 'export', 'archived'].forEach(t => {
                const btn = document.getElementById(`tab-btn-${t}`);
                if (t === tab) {
                    btn.className = "px-4 py-2 rounded-lg text-xs font-semibold bg-blue-600 text-white transition-colors";
                } else {
                    btn.className = "px-4 py-2 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:bg-slate-700 transition-colors";
                }
            });
            renderProcesses();
        };

        window.addContainerField = function() {
            const container = document.getElementById('containers-container');
            const div = document.createElement('div');
            div.className = "container-row bg-slate-900 p-2.5 rounded-lg border border-slate-800 space-y-2";
            div.innerHTML = `
                <div class="flex gap-2">
                    <input type="text" placeholder="Nº Contêiner" class="container-num flex-1 bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs uppercase" ${operationType === 'import' ? 'required' : ''}>
                    <select class="container-tipo w-24 bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs">
                        <option value="20DRY">20DRY</option>
                        <option value="40HC">40HC</option>
                        <option value="40DRY">40DRY</option>
                        <option value="40OT">40OT</option>
                    </select>
                    <button type="button" onclick="this.parentElement.parentElement.remove()" class="text-slate-500 hover:text-red-400 px-1"><i class="fa-solid fa-trash"></i></button>
                </div>
                <div class="container-export-extras ${operationType === 'export' ? '' : 'hidden'} grid grid-cols-2 gap-2">
                    <input type="text" placeholder="Tara (kg)" class="container-tara bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs">
                    <input type="text" placeholder="Lacre" class="container-lacre bg-slate-950 border border-slate-800 rounded px-2 py-1 text-xs">
                </div>
            `;
            container.appendChild(div);
        };

        window.saveProcess = async function(e) {
            e.preventDefault();
            if (!currentUser) return;

            const containers = [];
            if (operationType === 'import') {
                const containerRows = document.querySelectorAll('.container-row');
                containerRows.forEach(row => {
                    const num = row.querySelector('.container-num').value.trim();
                    const tipo = row.querySelector('.container-tipo').value;
                    if (num) {
                        containers.push({
                            num,
                            tipo,
                            tara: '',
                            lacre: '',
                            checklist: {
                                carregamento: { done: false, data: '' },
                                vazio: { done: false, data: '' },
                                cte: { done: false },
                                ciot: { done: false },
                                mdfe: { done: false },
                                encerrarMdfe: { done: false }
                            },
                            vazioProof: null
                        });
                    }
                });

                if (containers.length === 0) {
                    alert('Adicione pelo menos um contêiner para a importação.');
                    return;
                }
            }

            let newProcess = {
                userId: currentUser.uid,
                type: operationType,
                archived: false,
                createdAt: serverTimestamp(),
                containers
            };

            if (operationType === 'import') {
                newProcess.importador = document.getElementById('imp-importador').value.trim();
                newProcess.doc = document.getElementById('imp-doc').value.trim();
                newProcess.armador = document.getElementById('imp-armador').value.trim();
                newProcess.termCarga = document.getElementById('imp-term-carga').value.trim();
                newProcess.termVazio = document.getElementById('imp-term-vazio').value.trim();
            } else {
                newProcess.exportador = document.getElementById('exp-exportador').value.trim();
                newProcess.ref = document.getElementById('exp-ref').value.trim();
                newProcess.armador = document.getElementById('exp-armador').value.trim();
                newProcess.booking = document.getElementById('exp-booking').value.trim();
                newProcess.navio = document.getElementById('exp-navio').value.trim();
                newProcess.dlDraft = document.getElementById('exp-dl-draft').value;
                newProcess.dlCarga = document.getElementById('exp-dl-carga').value;
                newProcess.termVazioNome = document.getElementById('exp-term-vazio-nome').value.trim();
                newProcess.termVazioAgenda = document.getElementById('exp-term-vazio-agenda').value;
                newProcess.termCheioNome = document.getElementById('exp-term-cheio-nome').value.trim();
                newProcess.termCheioAgenda = document.getElementById('exp-term-cheio-agenda').value;
            }

            try {
                await addDoc(collection(db, "processes"), newProcess);
                document.getElementById('process-form').reset();
                loadProcesses();
            } catch (err) {
                alert("Erro ao salvar processo: " + err.message);
            }
        };

        function loadProcesses() {
            if (!currentUser) return;
            if (unsubscribeProcesses) unsubscribeProcesses();

            const q = query(collection(db, "processes"), where("userId", "==", currentUser.uid));
            unsubscribeProcesses = onSnapshot(q, (querySnapshot) => {
                processes = [];
                querySnapshot.forEach((docSnap) => {
                    processes.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderProcesses();
                if (currentModalProcessId) openModal(currentModalProcessId);
            }, (err) => {
                console.error("Erro ao carregar processos:", err);
            });
        }

        window.renderProcesses = function() {
            const listContainer = document.getElementById('process-list');
            listContainer.innerHTML = '';

            const filtered = processes.filter(p => {
                if (activeTab === 'archived') return p.archived;
                if (activeTab === 'import') return !p.archived && p.type === 'import';
                if (activeTab === 'export') return !p.archived && p.type === 'export';
                return false;
            });

            if (filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-16 text-slate-500 text-xs">
                        Nenhum processo encontrado nesta categoria.
                    </div>
                `;
                return;
            }

            filtered.forEach(p => {
                const isImport = p.type === 'import';
                const title = isImport ? `DI/DTA/DUIMP: ${p.doc}` : `Booking: ${p.booking} (Ref: ${p.ref})`;
                const client = isImport ? p.importador : p.exportador;
                const loadTerm = isImport ? p.termCarga : p.termCheioNome;
                const isEmbraport = loadTerm && loadTerm.toLowerCase().includes('embraport');

                let totalTasks = 0;
                let completedTasks = 0;
                p.containers.forEach(c => {
                    Object.values(c.checklist).forEach(t => {
                        totalTasks++;
                        if (t.done) completedTasks++;
                    });
                });
                const progress = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

                const card = document.createElement('div');
                card.className = "bg-slate-950 border border-slate-800 rounded-xl p-4 flex items-center justify-between hover:border-slate-700 transition-all cursor-pointer";
                card.onclick = () => openModal(p.id);

                card.innerHTML = `
                    <div class="flex items-center gap-4 flex-1">
                        <div class="w-10 h-10 rounded-lg ${isImport ? 'bg-blue-600/20 text-blue-400' : 'bg-purple-600/20 text-purple-400'} flex items-center justify-center shrink-0">
                            <i class="fa-solid ${isImport ? 'fa-ship' : 'fa-plane-departure'}"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-xs truncate">${escapeHtml(title)}</span>
                                <span class="px-2 py-0.5 rounded text-[10px] font-semibold ${isImport ? 'bg-blue-950 text-blue-400 border border-blue-900' : 'bg-purple-950 text-purple-400 border border-purple-900'}">${isImport ? 'Importação' : 'Exportação'}</span>
                                ${isEmbraport && !p.archived ? '<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-amber-950 text-amber-400 border border-amber-900 animate-pulse"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Janela Embraport (24h/48h)</span>' : ''}
                            </div>
                            <div class="text-xs text-slate-400 flex items-center gap-3 mt-1">
                                <span><strong class="text-slate-300">Cliente:</strong> ${escapeHtml(client || 'N/D')}</span>
                                <span><strong class="text-slate-300">Armador:</strong> ${escapeHtml(p.armador || 'N/D')}</span>
                                <span><strong class="text-slate-300">Contêineres:</strong> ${p.containers.length} un</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-6 ml-4">
                        <div class="w-32 text-right">
                            <div class="text-[10px] text-slate-400 mb-1">Progresso (${progress}%)</div>
                            <div class="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden">
                                <div class="bg-blue-500 h-full transition-all" style="width: ${progress}%"></div>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-slate-600 text-xs"></i>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        };

        window.openModal = function(id) {
            currentModalProcessId = id;
            const p = processes.find(item => item.id === id);
            if (!p) return;

            const isImport = p.type === 'import';
            document.getElementById('modal-title').innerText = isImport ? `Importação - ${p.doc}` : `Exportação - Booking ${p.booking}`;
            
            const content = document.getElementById('modal-content');
            
            let containersHtml = '';
            if (p.containers.length === 0) {
                containersHtml = `<div class="text-xs text-amber-400 bg-amber-950/30 border border-amber-900/50 p-3 rounded-lg"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Nenhum contêiner cadastrado para este processo ainda. Adicione abaixo quando estiver próximo ao deadline.</div>`;
            } else {
                p.containers.forEach((c, cIdx) => {
                    let checklistHtml = '';
                    const labels = isImport ? {
                        carregamento: 'Agendamento de Carregamento',
                        vazio: 'Agendamento de Vazio',
                        cte: 'Gerar CTE',
                        ciot: 'Gerar CIOT',
                        mdfe: 'Gerar MDFE',
                        encerrarMdfe: 'Encerrar MDFE'
                    } : {
                        carregamento: 'Agendamento de Carregamento',
                        vazio: 'Agendamento de Vazio',
                        cte: 'Gerar CTE',
                        ciot: 'Gerar CIOT',
                        mdfe: 'Gerar MDFE'
                    };

                    const keysOrder = isImport 
                        ? ['carregamento', 'vazio', 'cte', 'ciot', 'mdfe', 'encerrarMdfe']
                        : ['carregamento', 'vazio', 'cte', 'ciot', 'mdfe'];

                    keysOrder.forEach(key => {
                        const task = c.checklist[key];
                        if (!task) return;
                        checklistHtml += `
                            <div class="flex items-center justify-between bg-slate-950 p-2.5 rounded-lg border border-slate-800/60">
                                <div class="flex items-center gap-3">
                                    <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask('${p.id}', ${cIdx}, '${key}')" class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-blue-600 focus:ring-0 cursor-pointer">
                                    <span class="text-xs ${task.done ? 'line-through text-slate-500' : 'text-slate-200'}">${labels[key]}</span>
                                </div>
                                ${(key === 'carregamento' || key === 'vazio') ? `
                                    <input type="datetime-local" value="${task.data || ''}" onchange="updateTaskDate('${p.id}', ${cIdx}, '${key}', this.value)" class="bg-slate-900 border border-slate-800 rounded px-2 py-1 text-[11px] text-slate-300 focus:outline-none focus:border-blue-500">
                                ` : ''}
                            </div>
                        `;
                    });

                    containersHtml += `
                        <div class="bg-slate-950/50 border border-slate-800 rounded-xl p-4 space-y-3">
                            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                                <span class="text-xs font-bold text-blue-400"><i class="fa-solid fa-box mr-1.5"></i>Contêiner ${cIdx + 1}: ${escapeHtml(c.num)} (${escapeHtml(c.tipo)})</span>
                                <div class="flex items-center gap-3">
                                    <span class="text-xs text-slate-400">Tara: ${escapeHtml(c.tara || '-')} | Lacre: ${escapeHtml(c.lacre || '-')}</span>
                                    <button onclick="removeContainer('${p.id}', ${cIdx})" class="text-red-400 hover:text-red-300 text-xs" title="Remover Contêiner"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 gap-2">
                                ${checklistHtml}
                            </div>
                            <div class="pt-2 border-t border-slate-800 flex items-center justify-between">
                                <div class="text-xs text-slate-400">
                                    Comprovante Devolução Vazio: 
                                    <span class="${c.vazioProof ? 'text-emerald-400 font-semibold' : 'text-amber-400'}">${c.vazioProof?.url ? 'Enviado ✅' : 'Pendente ⏳'}</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    ${c.vazioProof?.url ? `<a href="${escapeHtml(c.vazioProof.url)}" target="_blank" rel="noopener noreferrer" class="text-xs text-blue-400 hover:underline">Abrir comprovante</a>` : ''}
                                    <input type="file" accept="image/jpeg,image/png,image/webp,application/pdf" onchange="uploadVazioProof(event, '${p.id}', ${cIdx})" class="text-xs text-slate-400 file:mr-2 file:py-1 file:px-2.5 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-slate-300 hover:file:bg-slate-700 cursor-pointer">
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            let allProofsDone = p.containers.length > 0 && p.containers.every(c => c.vazioProof?.url);

            content.innerHTML = `
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs">
                    <div><span class="text-slate-400 block mb-0.5">Cliente</span><strong class="text-slate-200">${isImport ? p.importador : p.exportador}</strong></div>
                    <div><span class="text-slate-400 block mb-0.5">${isImport ? 'Nº Documento' : 'Booking'}</span><strong class="text-slate-200">${escapeHtml(isImport ? p.doc : p.booking)}</strong></div>
                    <div><span class="text-slate-400 block mb-0.5">Armador</span><strong class="text-slate-200">${escapeHtml(p.armador || 'N/D')}</strong></div>
                    <div><span class="text-slate-400 block mb-0.5">${isImport ? 'Term. Carga' : 'Navio'}</span><strong class="text-slate-200">${escapeHtml(isImport ? (p.termCarga || 'N/D') : (p.navio || 'N/D'))}</strong></div>
                </div>

                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <h4 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Contêineres e Checklist</h4>
                        <button onclick="promptAddContainer('${p.id}')" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition-colors"><i class="fa-solid fa-plus mr-1"></i> Adicionar Contêiner</button>
                    </div>
                    ${containersHtml}
                </div>

                <div class="flex items-center justify-between pt-4 border-t border-slate-800">
                    <button onclick="deleteProcess('${p.id}')" class="bg-red-600/20 text-red-400 hover:bg-red-600/30 px-4 py-2 rounded-lg text-xs font-medium transition-colors">Excluir Processo</button>
                    ${!p.archived ? `
                        <button onclick="archiveProcess('${p.id}')" ${!allProofsDone ? 'disabled' : ''} class="bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-800 disabled:text-slate-600 text-white px-5 py-2 rounded-lg text-xs font-medium transition-colors shadow-lg">
                            Finalizar e Arquivar Processo
                        </button>
                    ` : '<span class="text-xs text-emerald-400 font-semibold"><i class="fa-solid fa-circle-check mr-1"></i>Processo Arquivado</span>'}
                </div>
            `;

            document.getElementById('details-modal').classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('details-modal').classList.add('hidden');
            currentModalProcessId = null;
        };

        window.promptAddContainer = async function(pId) {
            const p = processes.find(item => item.id === pId);
            if (!p) return;

            const num = prompt("Digite o número do Contêiner:");
            if (!num) return;
            const tipo = prompt("Digite o tipo do Contêiner (ex: 20DRY, 40HC):", "40HC") || "40HC";
            let tara = "";
            let lacre = "";

            if (p.type === 'export') {
                tara = prompt("Informe a Tara (kg):", "") || "";
                lacre = prompt("Informe o Lacre:", "") || "";
            }

            p.containers.push({
                num: num.trim().toUpperCase(),
                tipo: tipo.trim().toUpperCase(),
                tara: tara.trim(),
                lacre: lacre.trim(),
                checklist: p.type === 'import' ? {
                    carregamento: { done: false, data: '' },
                    vazio: { done: false, data: '' },
                    cte: { done: false },
                    ciot: { done: false },
                    mdfe: { done: false },
                    encerrarMdfe: { done: false }
                } : {
                    carregamento: { done: false, data: '' },
                    vazio: { done: false, data: '' },
                    cte: { done: false },
                    ciot: { done: false },
                    mdfe: { done: false }
                },
                vazioProof: null
            });

            await updateDoc(doc(db, "processes", pId), { containers: p.containers });
            openModal(pId);
            loadProcesses();
        };

        window.removeContainer = async function(pId, cIdx) {
            if (!confirm("Deseja remover este contêiner do processo?")) return;
            const p = processes.find(item => item.id === pId);
            if (!p) return;
            p.containers.splice(cIdx, 1);
            await updateDoc(doc(db, "processes", pId), { containers: p.containers });
            openModal(pId);
            loadProcesses();
        };

        window.toggleTask = async function(pId, cIdx, taskKey) {
            const p = processes.find(item => item.id === pId);
            if (!p) return;
            p.containers[cIdx].checklist[taskKey].done = !p.containers[cIdx].checklist[taskKey].done;
            await updateDoc(doc(db, "processes", pId), { containers: p.containers });
            openModal(pId);
            loadProcesses();
        };

        window.updateTaskDate = async function(pId, cIdx, taskKey, val) {
            const p = processes.find(item => item.id === pId);
            if (!p) return;
            p.containers[cIdx].checklist[taskKey].data = val;
            await updateDoc(doc(db, "processes", pId), { containers: p.containers });
        };

        window.uploadVazioProof = async function(e, pId, cIdx) {
            const file = e.target.files[0];
            if (!file) return;

            const allowedTypes = ['image/jpeg', 'image/png', 'image/webp', 'application/pdf'];
            const maxSize = 10 * 1024 * 1024;
            if (!allowedTypes.includes(file.type)) {
                alert('Formato não suportado. Use JPG, PNG, WEBP ou PDF.');
                e.target.value = '';
                return;
            }
            if (file.size > maxSize) {
                alert('O arquivo deve ter no máximo 10 MB.');
                e.target.value = '';
                return;
            }

            try {
                const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
                const fileRef = storageRef(storage, `users/${currentUser.uid}/processes/${pId}/containers/${cIdx}/${Date.now()}_${safeName}`);
                const snapshot = await uploadBytes(fileRef, file, { contentType: file.type });
                const url = await getDownloadURL(snapshot.ref);

                const p = processes.find(item => item.id === pId);
                if (!p || !p.containers?.[cIdx]) throw new Error('Contêiner não encontrado.');

                p.containers[cIdx].vazioProof = {
                    url,
                    nome: file.name,
                    tipo: file.type,
                    tamanho: file.size,
                    enviadoEm: new Date().toISOString()
                };

                await updateDoc(doc(db, "processes", pId), { containers: p.containers });
                openModal(pId);
            } catch (err) {
                console.error(err);
                alert('Erro ao enviar comprovante: ' + err.message);
            } finally {
                e.target.value = '';
            }
        };

        window.archiveProcess = async function(pId) {
            await updateDoc(doc(db, "processes", pId), { archived: true });
            closeModal();
            loadProcesses();
        };

        window.deleteProcess = async function(pId) {
            if (confirm("Tem certeza que deseja excluir este processo?")) {
                await deleteDoc(doc(db, "processes", pId));
                closeModal();
                loadProcesses();
            }
        };
    </script>
</body>
</html>
