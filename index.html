<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiTrack Pro - Gestão Logística</title>

    <!-- Aplica o tema salvo (claro/escuro) ANTES de qualquer estilo carregar,
         pra tela não "piscar" no tema errado ao abrir o app. -->
    <script>
        (function () {
            try {
                if (localStorage.getItem('logitrack-theme') === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>

    <!-- PWA: instalável no celular/desktop (ícone, tela cheia, cor do tema) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#B10004">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LogiTrack">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- SortableJS: usado para permitir arrastar e reordenar os cards de processo -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        // Paleta baseada na assinatura de e-mail da Transportes Imigrantes
        // (vermelho da marca + cinza do logo + texto quase-preto), em tons
        // claros e suaves (sem branco puro/forte) no lugar do tema escuro
        // original. Reaproveitamos os MESMOS nomes de classe (navy-900/800/700,
        // slate-*, blue-*) só trocando os valores hex, para não precisar mexer
        // em cada elemento do app.
        //
        // Cada cor aponta pra uma variável CSS (definida logo abaixo, com um
        // valor para tema claro e outro para tema escuro) em vez de um hex
        // fixo. O "rgb(var(...) / <alpha-value>)" é o formato que o Tailwind
        // usa pra continuar funcionando com opacidade (ex: bg-blue-600/20).
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            900: 'rgb(var(--navy-900) / <alpha-value>)', // fundo da página
                            800: 'rgb(var(--navy-800) / <alpha-value>)', // superfície dos cards/painéis
                            700: 'rgb(var(--navy-700) / <alpha-value>)', // preenchimento dos campos de formulário
                        },
                        slate: {
                            200: 'rgb(var(--slate-200) / <alpha-value>)', // texto secundário mais forte (ex: valor do Doc/Booking)
                            300: 'rgb(var(--slate-300) / <alpha-value>)', // texto principal do corpo
                            400: 'rgb(var(--slate-400) / <alpha-value>)', // rótulos e texto secundário
                            500: 'rgb(var(--slate-500) / <alpha-value>)', // texto/ícones apagados
                            600: 'rgb(var(--slate-600) / <alpha-value>)', // bordas de input
                            700: 'rgb(var(--slate-700) / <alpha-value>)', // bordas de cards/painéis
                        },
                        blue: { // usado como cor de destaque -> vermelho da marca
                            300: 'rgb(var(--blue-300) / <alpha-value>)',
                            400: 'rgb(var(--blue-400) / <alpha-value>)',
                            500: 'rgb(var(--blue-500) / <alpha-value>)',
                            600: 'rgb(var(--blue-600) / <alpha-value>)',
                            800: 'rgb(var(--blue-800) / <alpha-value>)',
                            900: 'rgb(var(--blue-900) / <alpha-value>)',
                        },
                        red: { 400: 'rgb(var(--red-400) / <alpha-value>)' }, // texto de erro/exclusão
                        emerald: { 400: 'rgb(var(--emerald-400) / <alpha-value>)' }, // texto de sucesso
                        yellow: { 400: 'rgb(var(--yellow-400) / <alpha-value>)', 500: 'rgb(var(--yellow-500) / <alpha-value>)' }, // texto de alertas
                        ink: 'rgb(var(--ink) / <alpha-value>)' // texto principal (escuro no tema claro, quase branco no escuro)
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* Tema CLARO (padrão) — mesmos valores de sempre, em "R G B". */
        :root {
            --navy-900: 244 242 238;
            --navy-800: 254 253 251;
            --navy-700: 236 232 226;
            --slate-200: 31 31 31;
            --slate-300: 42 42 42;
            --slate-400: 92 90 87;
            --slate-500: 110 108 107;
            --slate-600: 216 212 206;
            --slate-700: 234 231 226;
            --blue-300: 140 2 6;
            --blue-400: 193 8 11;
            --blue-500: 214 42 46;
            --blue-600: 177 0 4;
            --blue-800: 178 50 57;
            --blue-900: 122 2 9;
            --red-400: 200 39 45;
            --emerald-400: 11 125 84;
            --yellow-400: 146 64 14;
            --yellow-500: 180 83 9;
            --ink: 26 26 26;
        }

        /* Tema ESCURO — ativado adicionando data-theme="dark" na tag <html>
           (o botão de alternar tema faz isso). Mesma paleta de destaque
           (vermelho da marca), só que sobre um fundo navy escuro. */
        :root[data-theme="dark"] {
            --navy-900: 18 22 31;
            --navy-800: 27 33 48;
            --navy-700: 38 46 66;
            --slate-200: 236 237 238;
            --slate-300: 211 214 218;
            --slate-400: 155 163 176;
            --slate-500: 124 135 151;
            --slate-600: 55 65 90;
            --slate-700: 44 52 72;
            --blue-300: 194 58 65;
            --blue-400: 226 58 62;
            --blue-500: 229 72 77;
            --blue-600: 217 31 36;
            --blue-800: 140 42 48;
            --blue-900: 92 18 22;
            --red-400: 255 107 110;
            --emerald-400: 52 211 153;
            --yellow-400: 251 191 36;
            --yellow-500: 245 158 11;
            --ink: 243 241 238;
        }
    </style>
</head>
<body class="bg-navy-900 text-slate-300 font-sans antialiased h-screen flex overflow-hidden">

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="fixed inset-0 bg-navy-900 flex items-center justify-center z-50 overflow-hidden px-4">
        <div class="pointer-events-none absolute -top-32 -left-24 w-96 h-96 rounded-full bg-blue-600/10 blur-3xl"></div>
        <div class="pointer-events-none absolute -bottom-32 -right-24 w-96 h-96 rounded-full bg-blue-600/10 blur-3xl"></div>
        <div class="relative bg-navy-800 p-8 rounded-2xl shadow-2xl w-full max-w-sm border border-slate-700/80">
            <div class="flex flex-col items-center text-center mb-7">
                <div class="w-12 h-12 rounded-xl bg-blue-600/15 border border-blue-800/60 flex items-center justify-center mb-4">
                    <i class="fas fa-truck-fast text-blue-400 text-lg"></i>
                </div>
                <h2 class="text-xl font-bold text-ink tracking-tight">LogiTrack</h2>
                <p class="text-[11px] text-slate-500 uppercase tracking-widest mt-1">Gestão Logística</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1.5">E-mail</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                        <input type="email" id="auth-email" required class="w-full rounded-lg bg-navy-700 border border-slate-600 text-ink focus:border-blue-500 focus:ring-1 focus:ring-blue-500 pl-9 pr-3 py-2.5 outline-none transition">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1.5">Senha</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                        <input type="password" id="auth-password" required minlength="6" autocomplete="current-password" class="w-full rounded-lg bg-navy-700 border border-slate-600 text-ink focus:border-blue-500 focus:ring-1 focus:ring-blue-500 pl-9 pr-3 py-2.5 outline-none transition">
                    </div>
                </div>
                <div class="text-red-400 text-sm hidden bg-red-900/20 p-2.5 rounded-lg border border-red-800" id="auth-error"></div>
                <button type="submit" id="btn-login" class="w-full bg-blue-600 text-white font-bold p-3 rounded-lg hover:bg-blue-500 active:scale-[0.99] transition shadow-lg shadow-blue-900/50">Entrar</button>
                <p class="text-xs text-slate-500 text-center pt-2 flex items-center justify-center gap-1.5"><i class="fas fa-shield-halved text-slate-500"></i>Acesso restrito a contas criadas pelo administrador.</p>
            </form>
        </div>
    </div>

    <!-- SIDEBAR / FORMULÁRIO DE CRIAÇÃO -->
    <aside class="fixed inset-y-0 left-0 z-40 w-[340px] max-w-[85vw] -translate-x-full transition-transform duration-300 ease-in-out lg:static lg:z-auto lg:translate-x-0 bg-navy-800 shadow-2xl flex flex-col h-full border-r border-slate-700 hidden" id="sidebar">
        <div class="p-5 border-b border-slate-700 flex justify-between items-center bg-navy-900">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-blue-600/15 border border-blue-800/60 flex items-center justify-center">
                    <i class="fas fa-truck-fast text-blue-400 text-sm"></i>
                </div>
                <h1 class="text-base font-bold text-ink tracking-tight">LogiTrack</h1>
            </div>
            <div class="flex items-center gap-1">
                <button id="btn-close-sidebar" onclick="closeSidebarMobile()" title="Fechar menu" class="lg:hidden w-8 h-8 rounded-lg text-slate-400 hover:text-ink hover:bg-navy-700 transition flex items-center justify-center"><i class="fas fa-xmark text-sm"></i></button>
                <button id="btn-logout" title="Sair" class="w-8 h-8 rounded-lg text-slate-400 hover:text-ink hover:bg-navy-700 transition flex items-center justify-center"><i class="fas fa-sign-out-alt text-sm"></i></button>
            </div>
        </div>

        <div class="p-6 overflow-y-auto flex-1 custom-scrollbar">
            <h2 class="text-[11px] font-bold mb-4 text-slate-500 uppercase tracking-widest">Novo Processo</h2>

            <div class="flex gap-1 mb-6 bg-navy-900 p-1 rounded-lg border border-slate-700">
                <button id="btn-type-import" class="flex-1 py-2 text-sm font-semibold rounded-md bg-blue-600 text-white shadow transition-all duration-200">Importação</button>
                <button id="btn-type-export" class="flex-1 py-2 text-sm font-semibold rounded-md text-slate-400 hover:text-ink transition-all duration-200">Exportação</button>
            </div>

            <form id="process-form" class="space-y-4">
                <input type="hidden" id="process-type" value="import">
                
                <!-- Armador (comum a importação e exportação) -->
                <div id="fields-common-armador" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Armador</label>
                        <select id="f-armador" onchange="handleArmadorSelectForm(this)" class="w-full p-2.5 text-sm border border-slate-600 rounded-lg bg-navy-700 text-ink focus:border-blue-400 outline-none transition" required>
                            <option value="">Selecione...</option>
                        </select>
                    </div>
                </div>

                <!-- Campos Importação: Importador / Documento -->
                <div id="fields-import-doc" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Importador</label>
                        <input type="text" id="f-importador" maxlength="150" class="w-full p-2.5 text-sm border border-slate-600 rounded-lg bg-navy-700 text-ink focus:border-blue-400 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">DI / DTA / DUIMP</label>
                        <div class="flex gap-2">
                            <select id="f-documento-tipo" class="w-28 p-2.5 text-sm border border-slate-600 rounded-lg bg-navy-700 text-ink focus:border-blue-400 outline-none transition">
                                <option value="">Tipo</option>
                                <option value="DI">DI</option>
                                <option value="DTA">DTA</option>
                                <option value="DUIMP">DUIMP</option>
                            </select>
                            <input type="text" id="f-documento-numero" maxlength="150" placeholder="Número do documento" class="flex-1 p-2.5 text-sm border border-slate-600 rounded-lg bg-navy-700 text-ink focus:bg-slate-700 focus:border-blue-400 outline-none transition">
                        </div>
                    </div>
                </div>

                <!-- Campos Exportação -->
                <div id="fields-export" class="space-y-4 hidden">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Exportador</label>
                        <input type="text" id="f-exportador" maxlength="150" class="w-full p-2.5 text-sm border border-slate-600 rounded-lg bg-navy-700 text-ink focus:border-blue-400 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Referência do Processo</label>
                        <input type="text" id="f-referencia" maxlength="150" class="w-full p-2.5 text-sm border border-slate-600 rounded-lg bg-navy-700 text-ink focus:border-blue-400 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Número do Booking</label>
                        <input type="text" id="f-booking" maxlength="150" class="w-full p-2.5 text-sm border border-slate-600 rounded-lg bg-navy-700 text-ink focus:border-blue-400 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Nome do Navio</label>
                        <input type="text" id="f-navio" maxlength="150" class="w-full p-2.5 text-sm border border-slate-600 rounded-lg bg-navy-700 text-ink focus:border-blue-400 outline-none transition">
                    </div>
                </div>

                <!-- Motorista / Placas (comum a importação e exportação) -->
                <div id="fields-common-driver" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Motorista</label>
                        <input type="text" id="f-motorista" maxlength="150" class="w-full p-2.5 text-sm border border-slate-600 rounded-lg bg-navy-700 text-ink focus:bg-slate-700 focus:border-blue-400 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Placas do Caminhão</label>
                        <input type="text" id="f-placas" maxlength="150" placeholder="Ex: ABC1D23 e XYZ9F87" class="w-full p-2.5 text-sm border border-slate-600 rounded-lg bg-navy-700 text-ink focus:bg-slate-700 focus:border-blue-400 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Observações</label>
                        <textarea id="f-observacoes" maxlength="1000" rows="2" placeholder="Recados rápidos para a equipe (opcional)" class="w-full p-2.5 text-sm border border-slate-600 rounded-lg bg-navy-700 text-ink focus:bg-slate-700 focus:border-blue-400 outline-none transition resize-none"></textarea>
                    </div>
                </div>

                <!-- Campos Importação: Terminais -->
                <div id="fields-import-terminals" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Terminal de Carregamento</label>
                        <select id="f-term-carga" onchange="handleTerminalSelectForm(this, 'cheio')" class="w-full p-2.5 text-sm border border-slate-600 rounded-lg bg-navy-700 text-ink focus:border-blue-400 outline-none transition">
                            <option value="">Selecione...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Terminal de Vazio</label>
                        <select id="f-term-vazio" onchange="handleTerminalSelectForm(this, 'vazio')" class="w-full p-2.5 text-sm border border-slate-600 rounded-lg bg-navy-700 text-ink focus:border-blue-400 outline-none transition">
                            <option value="">Selecione...</option>
                        </select>
                    </div>
                </div>

                <div class="border-t border-slate-700 pt-5 mt-5">
                    <h3 class="text-sm font-bold text-ink mb-3 flex justify-between items-center">
                        Contêineres Iniciais
                        <button type="button" id="btn-add-container" class="text-blue-400 hover:text-blue-300 text-xs font-semibold transition flex items-center gap-1"><i class="fas fa-plus text-[10px]"></i> Adicionar</button>
                    </h3>
                    <p class="text-xs text-slate-500 mb-3 leading-relaxed">Opcional: você pode adicionar ou editar contêineres e lacres depois, abrindo o processo.</p>
                    <div id="container-list" class="space-y-3">
                        <!-- Containers inseridos dinamicamente -->
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg mt-8 hover:bg-blue-500 active:scale-[0.99] shadow-lg shadow-blue-900/50 transition">Criar Processo</button>
            </form>
        </div>
    </aside>

    <!-- Fundo escurecido atrás do menu lateral, só aparece no celular -->
    <div id="sidebar-backdrop" onclick="closeSidebarMobile()" class="hidden fixed inset-0 bg-black/50 z-30 lg:hidden"></div>

    <!-- PAINEL PRINCIPAL -->
    <main class="flex-1 flex flex-col h-full hidden min-w-0" id="main-panel">
        <header class="bg-navy-800 shadow-md border-b border-slate-700 px-4 sm:px-8 py-3 sm:py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <button id="btn-open-sidebar" onclick="openSidebarMobile()" title="Abrir menu" class="lg:hidden shrink-0 w-9 h-9 rounded-lg text-slate-400 hover:text-ink hover:bg-navy-900 transition flex items-center justify-center border border-slate-700"><i class="fas fa-bars text-sm"></i></button>
                <!-- No celular: 3 colunas iguais, sempre visíveis e clicáveis, sem
                     precisar arrastar pra ver "Exportações"/"Arquivados". No
                     desktop (sm+): volta a ser a fileira original, lado a lado. -->
                <div class="grid grid-cols-3 gap-2 w-full sm:flex sm:w-auto sm:gap-8 sm:overflow-x-auto">
                    <button id="tab-import" class="shrink-0 text-center sm:text-left text-sm font-bold text-blue-400 border-b-2 border-blue-400 pb-2 transition-colors"><span class="sm:hidden">Importação</span><span class="hidden sm:inline">Importações Ativas</span></button>
                    <button id="tab-export" class="shrink-0 text-center sm:text-left text-sm font-bold text-slate-500 hover:text-slate-300 border-b-2 border-transparent pb-2 transition-colors"><span class="sm:hidden">Exportação</span><span class="hidden sm:inline">Exportações Ativas</span></button>
                    <button id="tab-archive" class="shrink-0 text-center sm:text-left text-sm font-bold text-slate-500 hover:text-slate-300 border-b-2 border-transparent pb-2 transition-colors">Arquivados</button>
                </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <button id="btn-toggle-theme" onclick="toggleTheme()" title="Alternar modo claro/escuro" class="w-9 h-9 rounded-full text-slate-400 hover:text-ink hover:bg-navy-900 transition flex items-center justify-center border border-slate-700">
                    <i class="fas fa-moon text-sm"></i>
                </button>
                <div class="flex items-center gap-2 text-sm text-slate-300 bg-navy-900 pl-2 pr-3.5 py-1.5 rounded-full border border-slate-700" id="user-display"></div>
            </div>
        </header>

        <div class="flex-1 p-4 sm:p-8 overflow-y-auto custom-scrollbar">
            <!-- Resumo rápido: contagem sempre da aba selecionada no momento
                 (Importações, Exportações ou Arquivados), nunca misturando os
                 dois tipos — já que prazo de Draft só existe pra exportação. -->
            <div id="resumo-bar" class="grid grid-cols-3 gap-2.5 sm:gap-4 mb-4">
                <div id="resumo-total-box" class="bg-navy-800 border border-slate-700 rounded-xl px-3 py-2.5 sm:px-4 sm:py-3">
                    <div id="resumo-total-label" class="text-[10px] sm:text-[11px] text-slate-500 font-bold uppercase tracking-widest mb-0.5">Em andamento</div>
                    <div id="resumo-total" class="text-xl sm:text-2xl font-bold text-ink">0</div>
                </div>
                <div id="resumo-prazo-box" class="bg-navy-800 border border-slate-700 rounded-xl px-3 py-2.5 sm:px-4 sm:py-3">
                    <div class="text-[10px] sm:text-[11px] text-yellow-500 font-bold uppercase tracking-widest mb-0.5">Prazo próximo</div>
                    <div id="resumo-prazo" class="text-xl sm:text-2xl font-bold text-ink">0</div>
                </div>
                <div id="resumo-atraso-box" class="bg-navy-800 border border-slate-700 rounded-xl px-3 py-2.5 sm:px-4 sm:py-3">
                    <div class="text-[10px] sm:text-[11px] text-blue-600 font-bold uppercase tracking-widest mb-0.5">Atrasados</div>
                    <div id="resumo-atraso" class="text-xl sm:text-2xl font-bold text-ink">0</div>
                </div>
            </div>
            <div class="relative mb-4">
                <i class="fas fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                <input type="text" id="search-processos" placeholder="Buscar por armador, motorista, placa, documento/booking ou nº do contêiner..." oninput="filterProcesses(this.value)" class="w-full pl-9 pr-9 py-2.5 text-sm border border-slate-600 rounded-lg bg-navy-800 text-ink focus:border-blue-500 outline-none transition">
                <button type="button" id="btn-clear-search" onclick="clearSearch()" title="Limpar busca" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-ink w-5 h-5 items-center justify-center rounded-full hover:bg-navy-700 transition"><i class="fas fa-xmark text-xs"></i></button>
            </div>
            <div id="processes-container" class="space-y-3.5">
                <!-- Cartões de processos -->
            </div>
        </div>
    </main>

    <!-- MODAL DE DETALHES -->
    <div id="process-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div id="process-modal-panel" class="bg-navy-800 rounded-2xl shadow-2xl w-full max-w-5xl max-h-[90vh] flex flex-col border border-slate-700 overflow-hidden">

            <div class="bg-navy-900 p-5 border-b border-slate-700 flex justify-between items-start">
                <div>
                    <div class="flex gap-3 items-center mb-1">

    <!-- Área usada só na hora de exportar um processo em PDF: fica escondida
         na tela normal e só aparece quando o navegador entra em modo de
         impressão (Ctrl+P / "Salvar como PDF"), via CSS no final do arquivo. -->
    <div id="print-area"></div>

    <!-- Firebase SDKs e Lógica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, doc, updateDoc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKGjOftcyDZ-5yPA-5NK55GohtGlrfbeQ",
            authDomain: "track-logistica.firebaseapp.com",
            projectId: "track-logistica",
            storageBucket: "track-logistica.firebasestorage.app",
            messagingSenderId: "986198520521",
            appId: "1:986198520521:web:a4c088bc7c4e773156d318"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentActiveTab = 'import';
        let processes = [];
        let currentViewingProcessId = null;
        let searchQuery = ''; // busca rápida (armador, motorista, placa, doc/booking, nº do contêiner)

        // Lista de terminais pré-cadastrados, compartilhada com toda a equipe
        // (documento único em config/terminals). "cheio" = terminais onde se
        // pega/deposita contêiner cheio (Terminal de Carregamento / Depósito
        // Cheio); "vazio" = terminais de devolução/retirada de vazio.
        let terminaisCadastrados = { vazio: [], cheio: [] };

        // Lista de armadores pré-cadastrados, compartilhada com toda a equipe

        let armadoresCadastrados = [];

        // Lista de tipos de contêiner pré-cadastrados (ex: 20DC, 40HC),

        let tiposCadastrados = [];

        const loginScreen = document.getElementById('login-screen');
        const sidebar = document.getElementById('sidebar');

        // MENU LATERAL NO CELULAR: em telas grandes (lg+) o menu fica sempre
        // visível ao lado (comportamento original, inalterado); em telas

        window.openSidebarMobile = () => {
            sidebar.classList.remove('-translate-x-full');

        window.closeSidebarMobile = () => {
            sidebar.classList.add('-translate-x-full');

            document.getElementById('sidebar-backdrop').classList.add('hidden');
        };

        // MODO ESCURO (opcional, fica salvo no navegador de cada pessoa)
        const applyThemeIcon = () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const icon = document.querySelector('#btn-toggle-theme i');
            if (icon) icon.className = isDark ? 'fas fa-sun text-sm' : 'fas fa-moon text-sm';
        };
        window.toggleTheme = () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('logitrack-theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('logitrack-theme', 'dark');
            }
            applyThemeIcon();
        };
        applyThemeIcon(); // reflete no ícone o tema já aplicado (definido no script do head)

        // SEGURANÇA: escapa qualquer valor antes de inseri-lo via innerHTML,
        // impedindo que texto digitado pelo usuário (armador, número de contêiner,
        // e-mail, etc.) seja interpretado como HTML/JS (XSS armazenado).
        const escapeHtml = (value) => {
            if (value === null || value === undefined) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        };

        // Converte o valor de um <input type="datetime-local"> (ex:
        // "2026-09-20T14:30") pro formato usado no dia a dia (dd/mm/aaaa hh:mm).
        const formatarDataHora = (valor) => {
            if (!valor) return '—';
            const data = new Date(valor);
            if (isNaN(data.getTime())) return '—';
            const pad = (n) => String(n).padStart(2, '0');
            return `${pad(data.getDate())}/${pad(data.getMonth() + 1)}/${data.getFullYear()} ${pad(data.getHours())}:${pad(data.getMinutes())}`;
        };

        // Versão compacta (sem ano), usada no card da tela principal onde o
        // espaço é mais apertado. Retorna null se não houver data válida, pra
        // quem chamar decidir se mostra alguma coisa no lugar ou nada.
        const formatarDataHoraCurta = (valor) => {
            if (!valor) return null;
            const data = new Date(valor);
            if (isNaN(data.getTime())) return null;
            const pad = (n) => String(n).padStart(2, '0');
            return `${pad(data.getDate())}/${pad(data.getMonth() + 1)} ${pad(data.getHours())}:${pad(data.getMinutes())}`;
        };

        // ORDEM PERSONALIZADA DOS CARDS (arrastar para reordenar). Fica salva
        // só neste navegador (localStorage) — é uma preferência pessoal, não
        // é compartilhada com o resto da equipe.
        let cardSortable = null; // instância do SortableJS ativa no momento, se houver

        const getCardOrder = () => {
            try {
                const raw = localStorage.getItem('logitrack-card-order');
                const arr = raw ? JSON.parse(raw) : [];
                return Array.isArray(arr) ? arr : [];
            } catch (e) {
                return [];
            }
        };

        // Lê a ordem atual dos cards no DOM (depois de um drag) e salva.
        // Ids que já estavam guardados mas não aparecem nesta tela (ex: de
        // outra aba) são mantidos no fim, preservando a posição deles.
        const saveCardOrderFromContainer = (container) => {
            const idsNaTela = Array.from(container.children)
                .map(el => el.dataset.processId)
                .filter(Boolean);
            const resto = getCardOrder().filter(id => !idsNaTela.includes(id));
            try {
                localStorage.setItem('logitrack-card-order', JSON.stringify([...idsNaTela, ...resto]));
            } catch (e) {}
        };

        // TABELA DE VALORES DO DÍGITO VERIFICADOR (norma ISO 6346), usada para
        // conferir se a numeração do contêiner foi digitada corretamente. Cada
        // letra recebe um valor de 10 a 38, pulando de propósito os múltiplos
        // de 11 (11, 22, 33).
        const isoLetterValues = {};
        (() => {
            let v = 10;
            for (const letra of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') {
                while (v % 11 === 0) v++;
                isoLetterValues[letra] = v;
                v++;
            }
        })();

        // Calcula o dígito verificador esperado (0-9) a partir dos 4 letras +
        // 6 primeiros dígitos de uma numeração de contêiner (norma ISO 6346).
        const calcularDigitoVerificador = (dezCaracteres) => {
            let soma = 0;
            for (let i = 0; i < 10; i++) {
                const c = dezCaracteres[i];
                const valor = /[0-9]/.test(c) ? parseInt(c, 10) : isoLetterValues[c];
                soma += valor * Math.pow(2, i);
            }
            const resto = soma % 11;
            return resto === 10 ? 0 : resto;
        };

        // Confere se a numeração (formatada ou não) tem o dígito verificador
        // correto. Só avalia quando os 11 caracteres (4 letras + 7 dígitos) já
        // foram digitados — retorna null enquanto o número estiver incompleto,
        // pra não incomodar a pessoa ainda digitando.
        const validarNumeroContainer = (valor) => {
            const clean = (valor || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
            const letters = (clean.match(/[A-Z]/g) || []).join('');
            const digits = (clean.match(/[0-9]/g) || []).join('');
            if (letters.length !== 4 || digits.length !== 7) return null;
            const esperado = calcularDigitoVerificador(letters + digits.slice(0, 6));
            const digitado = parseInt(digits[6], 10);
            return esperado === digitado;
        };

        // Formata a numeração do contêiner em tempo real no padrão
        // "ABCD 123.456-7" (4 letras + espaço + 3 dígitos + ponto + 3 dígitos +
        // traço + dígito verificador), aceitando colagem fora de ordem, e avisa
        // quando o dígito verificador não confere (possível erro de digitação).
        window.maskContainerNumero = (inputEl) => {
            const clean = (inputEl.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
            const letters = (clean.match(/[A-Z]/g) || []).slice(0, 4).join('');
            const digits = (clean.match(/[0-9]/g) || []).slice(0, 7).join('');
            let out = letters;
            if (digits.length > 0) out += ' ' + digits.slice(0, 3);
            if (digits.length > 3) out += '.' + digits.slice(3, 6);
            if (digits.length > 6) out += '-' + digits.slice(6, 7);
            inputEl.value = out;

            const warnEl = inputEl.parentElement ? inputEl.parentElement.querySelector('.ct-num-warning') : null;
            if (warnEl) {
                warnEl.classList.toggle('hidden', validarNumeroContainer(out) !== false);
            }
        };

        // CHECKLIST ORDER IMPORT (Exatamente como solicitado)
        const importChecklistSteps = [
            { id: 'ag_carga', label: 'Agendamento de Carregamento', type: 'datetime' },
            { id: 'gerar_cte', label: 'Gerar CTe', type: 'checkbox' },
            { id: 'gerar_ciot', label: 'Gerar CIOT', type: 'checkbox' },
            { id: 'gerar_mdfe', label: 'Gerar MDFE', type: 'checkbox' },
            { id: 'encerrar_mdfe', label: 'Encerrar MDFE', type: 'checkbox' },
            { id: 'ag_vazio', label: 'Agendamento de Vazio', type: 'datetime' }
        ];

        // Monta um objeto de checklist "zerado" para um novo contêiner de importação.
        // Para cada etapa do tipo datetime, além do valor da data/hora, criamos um
        // campo extra "<id>_check" (booleano em string) usado só para marcar que
        // aquele agendamento já foi confirmado — é o que alimenta a barra de progresso.
        const novoChecklistImport = () => {
            const checklist = {};
            importChecklistSteps.forEach(step => {
                checklist[step.id] = '';
                if (step.type === 'datetime') checklist[`${step.id}_check`] = '';
            });
            return checklist;
        };

        // TERMINAIS PRÉ-CADASTRADOS (lista compartilhada com a equipe)
        const buildTerminalOptions = (categoria, valorSelecionado) => {
            const lista = terminaisCadastrados[categoria] || [];
            let html = `<option value="">Selecione...</option>`;
            lista.forEach(nome => {
                const selecionado = nome === valorSelecionado ? 'selected' : '';
                html += `<option value="${escapeHtml(nome)}" ${selecionado}>${escapeHtml(nome)}</option>`;
            });
            // Se o valor salvo não está (mais) na lista cadastrada (ex.: dado antigo
            // digitado como texto livre antes dessa mudança), mostra mesmo assim.
            if (valorSelecionado && !lista.includes(valorSelecionado)) {
                html += `<option value="${escapeHtml(valorSelecionado)}" selected>${escapeHtml(valorSelecionado)} (não cadastrado)</option>`;
            }
            html += `<option value="__novo__">+ Adicionar novo terminal...</option>`;
            return html;
        };

        // Redesenha os dois selects de terminal do formulário lateral (Novo Processo),
        // preservando o valor já escolhido.
        const renderTerminalSelectsInSidebar = () => {
            const selCarga = document.getElementById('f-term-carga');
            const selVazio = document.getElementById('f-term-vazio');
            if (selCarga) {
                const atual = selCarga.value === '__novo__' ? '' : selCarga.value;
                selCarga.innerHTML = buildTerminalOptions('cheio', atual);
            }
            if (selVazio) {
                const atual = selVazio.value === '__novo__' ? '' : selVazio.value;
                selVazio.innerHTML = buildTerminalOptions('vazio', atual);
            }
        };

        // Carrega/observa em tempo real a lista compartilhada de terminais.
        const loadTerminais = () => {
            const ref = doc(db, "config", "terminals");
            onSnapshot(ref, (snap) => {
                const data = snap.exists() ? snap.data() : {};
                terminaisCadastrados.vazio = data.vazio || [];
                terminaisCadastrados.cheio = data.cheio || [];
                renderTerminalSelectsInSidebar();
                if (currentViewingProcessId) {
                    const proc = processes.find(p => p.id === currentViewingProcessId);
                    if (proc) renderModalContent(proc);
                }
            });
        };

        // Pede o nome do novo terminal e adiciona na lista compartilhada (sem duplicar).
        // Retorna o nome adicionado, ou null se o usuário cancelou.
        window.adicionarNovoTerminal = async (categoria) => {
            const rotulo = categoria === 'vazio' ? 'Vazio' : 'Cheio';
            const nome = prompt(`Nome do novo terminal (${rotulo}):`);
            if (!nome || !nome.trim()) return null;
            const nomeLimpo = nome.trim().slice(0, 150);
            const atual = terminaisCadastrados[categoria] || [];
            if (!atual.includes(nomeLimpo)) {
                const novaLista = [...atual, nomeLimpo].sort((a, b) => a.localeCompare(b, 'pt-BR'));
                const ref = doc(db, "config", "terminals");
                await setDoc(ref, { [categoria]: novaLista }, { merge: true });
            }
            return nomeLimpo;
        };

        // onchange dos selects de terminal do formulário lateral (novo processo).
        window.handleTerminalSelectForm = async (selectEl, categoria) => {
            if (selectEl.value === '__novo__') {
                const novoNome = await window.adicionarNovoTerminal(categoria);
                renderTerminalSelectsInSidebar();
                const el = document.getElementById(selectEl.id);
                if (el) el.value = novoNome || '';
            }
        };

        // onchange dos selects de terminal dentro do modal (contêineres de exportação).
        window.handleTerminalSelect = async (selectEl, procId, ctId, field, categoria) => {
            if (selectEl.value === '__novo__') {
                const novoNome = await window.adicionarNovoTerminal(categoria);
                if (novoNome) {
                    await updateField(procId, ctId, field, novoNome);
                } else {
                    const proc = processes.find(p => p.id === procId);
                    if (proc) renderModalContent(proc);
                }
            } else {
                await updateField(procId, ctId, field, selectEl.value);
            }
        };

        // ARMADORES PRÉ-CADASTRADOS (lista compartilhada com a equipe)
        const buildArmadorOptions = (valorSelecionado) => {
            const lista = armadoresCadastrados || [];
            let html = `<option value="">Selecione...</option>`;
            lista.forEach(nome => {
                const selecionado = nome === valorSelecionado ? 'selected' : '';
                html += `<option value="${escapeHtml(nome)}" ${selecionado}>${escapeHtml(nome)}</option>`;
            });
            // Se o valor salvo não está (mais) na lista cadastrada (ex.: dado antigo
            // digitado como texto livre antes dessa mudança), mostra mesmo assim.
            if (valorSelecionado && !lista.includes(valorSelecionado)) {
                html += `<option value="${escapeHtml(valorSelecionado)}" selected>${escapeHtml(valorSelecionado)} (não cadastrado)</option>`;
            }
            html += `<option value="__novo__">+ Adicionar novo armador...</option>`;
            return html;
        };

        // Redesenha o select de armador do formulário lateral (Novo Processo),
        // preservando o valor já escolhido.
        const renderArmadorSelectInSidebar = () => {
            const selArmador = document.getElementById('f-armador');
            if (selArmador) {
                const atual = selArmador.value === '__novo__' ? '' : selArmador.value;
                selArmador.innerHTML = buildArmadorOptions(atual);
            }
        };

        // Carrega/observa em tempo real a lista compartilhada de armadores.
        const loadArmadores = () => {
            const ref = doc(db, "config", "armadores");
            onSnapshot(ref, (snap) => {
                const data = snap.exists() ? snap.data() : {};
                armadoresCadastrados = data.lista || [];
                renderArmadorSelectInSidebar();
            });
        };

        // Pede o nome do novo armador e adiciona na lista compartilhada (sem duplicar).
        // Retorna o nome adicionado, ou null se o usuário cancelou.
        window.adicionarNovoArmador = async () => {
            const nome = prompt('Nome do novo armador:');
            if (!nome || !nome.trim()) return null;
            const nomeLimpo = nome.trim().slice(0, 150);
            const atual = armadoresCadastrados || [];
            if (!atual.includes(nomeLimpo)) {
                const novaLista = [...atual, nomeLimpo].sort((a, b) => a.localeCompare(b, 'pt-BR'));
                const ref = doc(db, "config", "armadores");
                await setDoc(ref, { lista: novaLista }, { merge: true });
            }
            return nomeLimpo;
        };

        // onchange do select de armador do formulário lateral (novo processo).
        window.handleArmadorSelectForm = async (selectEl) => {
            if (selectEl.value === '__novo__') {
                const novoNome = await window.adicionarNovoArmador();
                renderArmadorSelectInSidebar();
                const el = document.getElementById(selectEl.id);
                if (el) el.value = novoNome || '';
            }
        };

        // TIPOS DE CONTÊINER PRÉ-CADASTRADOS (lista compartilhada com a equipe)
        const buildTipoOptions = (valorSelecionado) => {
            const lista = tiposCadastrados || [];
            let html = `<option value="">Selecione...</option>`;
            lista.forEach(nome => {
                const selecionado = nome === valorSelecionado ? 'selected' : '';
                html += `<option value="${escapeHtml(nome)}" ${selecionado}>${escapeHtml(nome)}</option>`;
            });
            // Se o valor salvo não está (mais) na lista cadastrada (ex.: dado antigo
            // digitado como texto livre antes dessa mudança), mostra mesmo assim.
            if (valorSelecionado && !lista.includes(valorSelecionado)) {
                html += `<option value="${escapeHtml(valorSelecionado)}" selected>${escapeHtml(valorSelecionado)} (não cadastrado)</option>`;
            }
            html += `<option value="__novo__">+ Adicionar novo tipo...</option>`;
            return html;
        };

        // Redesenha todos os selects de Tipo do formulário lateral (pode haver
        // mais de uma "Unidade" adicionada), preservando o valor já escolhido
        // em cada um.
        const renderTipoSelectsInSidebar = () => {
            document.querySelectorAll('#container-list .ct-tipo').forEach(sel => {
                const atual = sel.value === '__novo__' ? '' : sel.value;
                sel.innerHTML = buildTipoOptions(atual);
            });
        };

        // Carrega/observa em tempo real a lista compartilhada de tipos de contêiner.
        const loadTipos = () => {
            const ref = doc(db, "config", "tipos");
            onSnapshot(ref, (snap) => {
                const data = snap.exists() ? snap.data() : {};
                tiposCadastrados = data.lista || [];
                renderTipoSelectsInSidebar();
                if (currentViewingProcessId) {
                    const proc = processes.find(p => p.id === currentViewingProcessId);
                    if (proc) renderModalContent(proc);
                }
            });
        };

        // Pede o nome do novo tipo e adiciona na lista compartilhada (sem duplicar).
        // Retorna o nome adicionado, ou null se o usuário cancelou.
        window.adicionarNovoTipo = async () => {
            const nome = prompt('Nome do novo tipo de contêiner (ex: 40HC):');
            if (!nome || !nome.trim()) return null;
            const nomeLimpo = nome.trim().slice(0, 150);
            const atual = tiposCadastrados || [];
            if (!atual.includes(nomeLimpo)) {
                const novaLista = [...atual, nomeLimpo].sort((a, b) => a.localeCompare(b, 'pt-BR'));
                const ref = doc(db, "config", "tipos");
                await setDoc(ref, { lista: novaLista }, { merge: true });
            }
            return nomeLimpo;
        };

        // onchange dos selects de Tipo do formulário lateral (novo processo).
        // Cada "Unidade" adicionada tem o seu próprio select (sem id fixo), por
        // isso atualizamos direto pela referência do elemento clicado.
        window.handleTipoSelectForm = async (selectEl) => {
            if (selectEl.value === '__novo__') {
                const novoNome = await window.adicionarNovoTipo();
                renderTipoSelectsInSidebar();
                selectEl.value = novoNome || '';
            }
        };

        // onchange do select de Tipo dentro do modal (contêiner já salvo no processo).
        window.handleTipoSelect = async (selectEl, procId, ctId) => {
            if (selectEl.value === '__novo__') {
                const novoNome = await window.adicionarNovoTipo();
                if (novoNome) {
                    await updateField(procId, ctId, 'tipo', novoNome);
                } else {
                    const proc = processes.find(p => p.id === procId);
                    if (proc) renderModalContent(proc);
                }
            } else {
                await updateField(procId, ctId, 'tipo', selectEl.value);
            }
        };

        // AUTENTICAÇÃO
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loginScreen.classList.add('hidden');
                sidebar.classList.remove('hidden');
                mainPanel.classList.remove('hidden');
                document.getElementById('user-display').innerHTML = `<span class="w-5 h-5 rounded-full bg-blue-600/20 text-blue-400 text-[10px] font-bold flex items-center justify-center">${escapeHtml((user.email || '?').charAt(0).toUpperCase())}</span><span>${escapeHtml(user.email)}</span>`;
                loadProcesses();
                loadTerminais();
                loadArmadores();
                loadTipos();
            } else {
                currentUser = null;
                loginScreen.classList.remove('hidden');
                sidebar.classList.add('hidden');
                mainPanel.classList.add('hidden');
            }
        });

        // Os lembretes de Deadline Draft (3/2/1 dia) dependem só da data/hora
        // atual, não de uma mudança nos dados — então, se alguém deixar o
        // LogiTrack aberto, atualizamos os cards e o modal periodicamente
        // para o aviso "virar de dia" sozinho.
        setInterval(() => {
            if (!currentUser) return;
            renderProcesses();
            if (currentViewingProcessId) {
                const proc = processes.find(p => p.id === currentViewingProcessId);
                if (proc) renderModalContent(proc);
            }
        }, 30 * 60 * 1000);

        // SEGURANÇA: apenas login, sem auto-cadastro. Só entra quem já tem uma
        // conta criada manualmente pelo administrador em Firebase Console >
        // Authentication > Users > Add user. Nenhum novo usuário é criado a
        // partir desta tela.
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errorDiv = document.getElementById('auth-error');

            try {
                await signInWithEmailAndPassword(auth, email, password);
                errorDiv.classList.add('hidden');
            } catch (error) {
                const semAcesso = ['auth/user-not-found', 'auth/invalid-credential', 'auth/wrong-password'];
                if (semAcesso.includes(error.code)) {
                    errorDiv.innerText = "E-mail ou senha incorretos, ou esta conta ainda não foi cadastrada pelo administrador.";
                } else {
                    errorDiv.innerText = "Erro no login: " + error.message;
                }
                errorDiv.classList.remove('hidden');
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

        // ALTERNAR ABAS E TIPOS NO FORMULÁRIO
        const setFormType = (type) => {
            document.getElementById('process-type').value = type;
            const btnImport = document.getElementById('btn-type-import');
            const btnExport = document.getElementById('btn-type-export');
            const fImportDoc = document.getElementById('fields-import-doc');
            const fImportTerminals = document.getElementById('fields-import-terminals');
            const fExport = document.getElementById('fields-export');

            document.getElementById('container-list').innerHTML = '';
            addContainerField(type); // Adiciona 1 opcional por padrão

            if (type === 'import') {
                btnImport.className = 'flex-1 py-2 text-sm font-semibold rounded-md bg-blue-600 text-white shadow transition-all duration-200';
                btnExport.className = 'flex-1 py-2 text-sm font-semibold rounded-md text-slate-400 hover:text-ink transition-all duration-200 bg-transparent';
                fImportDoc.classList.remove('hidden');
                fImportTerminals.classList.remove('hidden');
                fExport.classList.add('hidden');
            } else {
                btnExport.className = 'flex-1 py-2 text-sm font-semibold rounded-md bg-blue-600 text-white shadow transition-all duration-200';
                btnImport.className = 'flex-1 py-2 text-sm font-semibold rounded-md text-slate-400 hover:text-ink transition-all duration-200 bg-transparent';
                fExport.classList.remove('hidden');
                fImportDoc.classList.add('hidden');
                fImportTerminals.classList.add('hidden');
            }
        };

        document.getElementById('btn-type-import').addEventListener('click', () => setFormType('import'));
        document.getElementById('btn-type-export').addEventListener('click', () => setFormType('export'));

        const setMainTab = (tab) => {
            currentActiveTab = tab;
            const tabs = {
                'import': document.getElementById('tab-import'),
                'export': document.getElementById('tab-export'),
                'archive': document.getElementById('tab-archive')
            };
            
            // IMPORTANTE: manter "shrink-0 text-center sm:text-left" igual ao
            // que já vem no HTML original — sem isso, no celular os botões
            // perdiam o alinhamento certo depois do primeiro clique e a aba
            // ficava difícil/impossível de tocar.
            Object.values(tabs).forEach(t => t.className = 'shrink-0 text-center sm:text-left text-sm font-bold text-slate-500 hover:text-slate-300 border-b-2 border-transparent pb-2 transition-colors');

            if(tab === 'archive') {
                tabs[tab].className = 'shrink-0 text-center sm:text-left text-sm font-bold text-emerald-500 border-b-2 border-emerald-500 pb-2 transition-colors';
            } else {
                tabs[tab].className = 'shrink-0 text-center sm:text-left text-sm font-bold text-blue-400 border-b-2 border-blue-400 pb-2 transition-colors';
            }
            renderProcesses();
        };

        document.getElementById('tab-import').addEventListener('click', () => setMainTab('import'));
        document.getElementById('tab-export').addEventListener('click', () => setMainTab('export'));
        document.getElementById('tab-archive').addEventListener('click', () => setMainTab('archive'));

        // BUSCA RÁPIDA de processos (armador, motorista, placa, doc/booking, nº do contêiner)
        window.filterProcesses = (valor) => {
            searchQuery = (valor || '').toLowerCase().trim();
            const btnClear = document.getElementById('btn-clear-search');
            if (searchQuery) {
                btnClear.classList.remove('hidden');
                btnClear.classList.add('flex');
            } else {
                btnClear.classList.add('hidden');
                btnClear.classList.remove('flex');
            }
            renderProcesses();
        };

        window.clearSearch = () => {
            const input = document.getElementById('search-processos');
            input.value = '';
            window.filterProcesses('');
            input.focus();
        };

        // GESTÃO DE CONTAINERS NO FORMULÁRIO LATERAL (OPCIONALIDADE)
        let containerCount = 0;
        const addContainerField = (type = document.getElementById('process-type').value) => {
            containerCount++;
            const div = document.createElement('div');
            div.className = 'bg-navy-900 p-3 rounded-lg border border-slate-700 relative';
            div.id = `ct-form-${containerCount}`;

            let html = `
                <div class="flex justify-between items-center mb-3">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Unidade ${containerCount}</span>
                    <button type="button" onclick="document.getElementById('ct-form-${containerCount}').remove()" class="w-6 h-6 rounded-md text-slate-500 hover:text-red-400 hover:bg-red-900/20 text-xs transition flex items-center justify-center"><i class="fas fa-trash"></i></button>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-2">
                    <div>
                        <input type="text" placeholder="ABCD 123.456-7" maxlength="15" oninput="maskContainerNumero(this)" class="ct-num w-full p-2 text-xs border border-slate-600 bg-navy-700 text-ink rounded-md outline-none focus:border-blue-500 transition">
                        <p class="ct-num-warning hidden text-[10px] text-red-400 mt-1 leading-tight">Dígito verificador não confere.</p>
                    </div>
                    <select onchange="handleTipoSelectForm(this)" class="ct-tipo w-full p-2 text-xs border border-slate-600 bg-navy-700 text-ink rounded-md outline-none focus:border-blue-500 transition">${buildTipoOptions('')}</select>
                </div>`;
                
            div.innerHTML = html;
            document.getElementById('container-list').appendChild(div);
        };
        
        document.getElementById('btn-add-container').addEventListener('click', () => addContainerField());
        addContainerField('import'); 

        // SALVAR NOVO PROCESSO
        document.getElementById('process-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const type = document.getElementById('process-type').value;
            
            let processData = {
                userId: currentUser.uid,
                type: type,
                status: 'active',
                createdAt: new Date().toISOString(),
                armador: document.getElementById('f-armador').value,
                motorista: document.getElementById('f-motorista').value,
                placas: document.getElementById('f-placas').value,
                observacoes: document.getElementById('f-observacoes').value,
                containers: []
            };

            if (type === 'import') {
                processData.importador = document.getElementById('f-importador').value;
                processData.documentoTipo = document.getElementById('f-documento-tipo').value;
                processData.documentoNumero = document.getElementById('f-documento-numero').value;
                processData.termCarga = document.getElementById('f-term-carga').value;
                processData.termVazio = document.getElementById('f-term-vazio').value;
            } else {
                processData.exportador = document.getElementById('f-exportador').value;
                processData.referencia = document.getElementById('f-referencia').value;
                processData.booking = document.getElementById('f-booking').value;
                processData.navio = document.getElementById('f-navio').value;
            }

            const ctForms = document.querySelectorAll('#container-list > div');
            ctForms.forEach((ctDiv, index) => {
                let numero = ctDiv.querySelector('.ct-num').value.trim();
                let tipo = ctDiv.querySelector('.ct-tipo').value.trim();
                
                // Salva mesmo se vazio, pois no modal o usuário vai editar depois
                let ct = {
                    id: `c_${Date.now()}_${index}`,
                    numero: numero,
                    tipo: tipo,
                    checklist: {} 
                };
                
                if (type === 'import') {
                    ct.checklist = novoChecklistImport();
                } else {
                    ct.tara = '';
                    ct.lacre = '';
                    ct.deadlineDraft = '';
                    ct.deadlineCarga = '';
                    ct.agVazio = '';
                    ct.termVazioExp = '';
                    ct.agCheio = '';
                    ct.termCheioExp = '';
                }
                processData.containers.push(ct);
            });

            try {
                await addDoc(collection(db, "processes"), processData);
                document.getElementById('process-form').reset();
                document.getElementById('container-list').innerHTML = '';
                containerCount = 0;
                setMainTab(type); // Muda para a aba correspondente para ver o processo criado
                closeSidebarMobile(); // no celular, fecha a gaveta do menu após criar (sem efeito no desktop)
            } catch (error) {
                console.error("Erro ao salvar:", error);
                alert("Erro ao criar processo.");
            }
        });

        // LER DO FIREBASE
        const loadProcesses = () => {
            const q = query(collection(db, "processes"), where("userId", "==", currentUser.uid));
            onSnapshot(q, (snapshot) => {
                processes = [];
                snapshot.forEach((doc) => {
                    processes.push({ id: doc.id, ...doc.data() });
                });
                renderProcesses();
                
                // Mantém o modal atualizado em tempo real se estiver aberto
                if(currentViewingProcessId) {
                    const updatedData = processes.find(p => p.id === currentViewingProcessId);
                    if(updatedData) renderModalContent(updatedData);
                }
            });
        };

        // LEMBRETE DE DEADLINE DRAFT (só exportação, só o prazo do Draft, que é
        // o mais importante). Olha a data/hora mais próxima entre todos os
        // contêineres do processo e devolve um aviso quando faltam 3, 2 ou 1
        // dia — ou quando já passou do prazo.
        const draftAlertConfig = {
            aviso:    { box: 'bg-yellow-900/15 border-yellow-500', icon: 'fa-clock', iconColor: 'text-yellow-500', text: 'text-yellow-500', badge: 'bg-yellow-900/10 text-yellow-500 border border-yellow-600/40' },
            atencao:  { box: 'bg-blue-900/10 border-blue-400', icon: 'fa-clock', iconColor: 'text-blue-400', text: 'text-blue-400', badge: 'bg-blue-900/10 text-blue-400 border border-blue-400/40' },
            urgente:  { box: 'bg-blue-900/15 border-blue-600', icon: 'fa-triangle-exclamation', iconColor: 'text-blue-600', text: 'text-blue-600', badge: 'bg-blue-900/15 text-blue-600 border border-blue-600/50' },
            atrasado: { box: 'bg-blue-900/20 border-blue-900', icon: 'fa-triangle-exclamation', iconColor: 'text-blue-900', text: 'text-blue-900', badge: 'bg-blue-900/20 text-blue-900 border border-blue-900/50' }
        };

        // Um contêiner é considerado "com o Draft já cumprido" quando já tem
        // Numeração, Tara e Lacre preenchidos — nesse ponto o lembrete não
        // faz mais sentido pra ele, mesmo que o Deadline Draft esteja perto
        // ou já tenha passado.
        const draftJaCumprido = (ct) => {
            return !!((ct.numero || '').trim() && (ct.tara || '').trim() && (ct.lacre || '').trim());
        };

        const getDraftDeadlineInfo = (proc) => {
            if (proc.type !== 'export' || proc.status !== 'active' || !proc.containers) return null;

            let maisProxima = null;
            proc.containers.forEach(ct => {
                if (!ct.deadlineDraft || draftJaCumprido(ct)) return;
                const data = new Date(ct.deadlineDraft);
                if (isNaN(data.getTime())) return;
                if (!maisProxima || data < maisProxima) maisProxima = data;
            });
            if (!maisProxima) return null;

            const diffMs = maisProxima.getTime() - Date.now();

            if (diffMs <= 0) {
                const diasAtraso = Math.floor(-diffMs / 86400000);
                return {
                    nivel: 'atrasado',
                    texto: diasAtraso > 0 ? `Draft atrasado há ${diasAtraso} dia${diasAtraso > 1 ? 's' : ''}` : 'Draft venceu hoje'
                };
            }

            const diasRestantes = Math.ceil(diffMs / 86400000);
            if (diasRestantes > 3) return null;

            const textos = { 1: 'Draft vence em 1 dia', 2: 'Draft vence em 2 dias', 3: 'Draft vence em 3 dias' };
            const nivel = diasRestantes === 1 ? 'urgente' : (diasRestantes === 2 ? 'atencao' : 'aviso');
            return { nivel, texto: textos[diasRestantes] };
        };

        // Calcula o progresso (0-100) de um processo, para a barrinha do card.
        // Importação: conta as etapas do checklist (checkboxes + os checkmarks de
        // agendamento) marcadas como concluídas, em todos os contêineres.
        // Exportação: conta os campos de prazo/agendamento preenchidos.
        const getProcessProgress = (proc) => {
            if (!proc.containers || proc.containers.length === 0) return 0;
            let total = 0, done = 0;

            if (proc.type === 'import') {
                proc.containers.forEach(ct => {
                    importChecklistSteps.forEach(step => {
                        total++;
                        if (step.type === 'checkbox') {
                            if (ct.checklist && ct.checklist[step.id] === 'true') done++;
                        } else if (step.type === 'datetime') {
                            if (ct.checklist && ct.checklist[`${step.id}_check`] === 'true') done++;
                        }
                    });
                });
            } else {
                const exportFields = ['deadlineDraft', 'deadlineCarga', 'agVazio', 'agCheio'];
                proc.containers.forEach(ct => {
                    exportFields.forEach(f => {
                        total++;
                        if (ct[f]) done++;
                    });
                });
            }

            return total === 0 ? 0 : Math.round((done / total) * 100);
        };

        // RESUMO NO TOPO: sempre contando só a aba selecionada no momento
        // (nunca importação + exportação misturados), já que o prazo de
        // Draft só existe pra exportação — não faria sentido aparecer no
        // resumo de Importações. Reaproveita getDraftDeadlineInfo, a mesma
        // função que já alimenta o aviso dentro de cada processo.
        const renderResumo = () => {
            const bar = document.getElementById('resumo-bar');
            const boxPrazo = document.getElementById('resumo-prazo-box');
            const boxAtraso = document.getElementById('resumo-atraso-box');
            const elLabelTotal = document.getElementById('resumo-total-label');
            const elTotal = document.getElementById('resumo-total');
            const elPrazo = document.getElementById('resumo-prazo');
            const elAtraso = document.getElementById('resumo-atraso');
            if (!bar) return;

            if (currentActiveTab === 'archive') {
                elLabelTotal.textContent = 'Arquivados';
                elTotal.textContent = processes.filter(p => p.status === 'archived').length;
                bar.className = 'grid grid-cols-1 gap-2.5 sm:gap-4 mb-4';
                boxPrazo.classList.add('hidden');
                boxAtraso.classList.add('hidden');
                return;
            }

            // Só exportação tem prazo de Draft, então os cartões de "Prazo
            // próximo" e "Atrasados" só aparecem na aba de Exportações.
            const isExport = currentActiveTab === 'export';
            elLabelTotal.textContent = isExport ? 'Exportações em andamento' : 'Importações em andamento';

            const relevantes = processes.filter(p => p.status === 'active' && p.type === currentActiveTab);
            elTotal.textContent = relevantes.length;

            if (!isExport) {
                bar.className = 'grid grid-cols-1 gap-2.5 sm:gap-4 mb-4';
                boxPrazo.classList.add('hidden');
                boxAtraso.classList.add('hidden');
                return;
            }

            bar.className = 'grid grid-cols-3 gap-2.5 sm:gap-4 mb-4';
            boxPrazo.classList.remove('hidden');
            boxAtraso.classList.remove('hidden');

            let prazoProximo = 0, atrasados = 0;
            relevantes.forEach(proc => {
                const info = getDraftDeadlineInfo(proc);
                if (!info) return;
                if (info.nivel === 'atrasado') atrasados++;
                else prazoProximo++;
            });
            elPrazo.textContent = prazoProximo;
            elAtraso.textContent = atrasados;
        };

        // RENDERIZAR CARTÕES (TELA PRINCIPAL)
        const renderProcesses = () => {
            renderResumo();
            const container = document.getElementById('processes-container');
            container.innerHTML = '';

            // Desfaz a instância de arrastar-e-soltar do render anterior (se
            // houver) antes de montar os cards de novo.
            if (cardSortable) {
                cardSortable.destroy();
                cardSortable = null;
            }

            let filtered = processes.filter(p => {
                if(currentActiveTab === 'archive') return p.status === 'archived';
                if(currentActiveTab === 'import') return p.status === 'active' && p.type === 'import';
                if(currentActiveTab === 'export') return p.status === 'active' && p.type === 'export';
                return false;
            });

            // Busca rápida: procura o termo digitado em armador, motorista,
            // placas, importador/exportador, documento/booking/referência/navio
            // e nos números de contêiner do processo.
            if (searchQuery) {
                filtered = filtered.filter(proc => {
                    const campos = [
                        proc.armador, proc.motorista, proc.placas,
                        proc.importador, proc.exportador,
                        proc.documentoNumero, proc.documento, proc.booking, proc.referencia, proc.navio,
                        proc.observacoes,
                        ...(proc.containers || []).map(c => c.numero)
                    ].filter(Boolean).join(' ').toLowerCase();
                    return campos.includes(searchQuery);
                });
            }

            if(filtered.length === 0) {
                const mensagem = searchQuery
                    ? `Nenhum processo encontrado para "${escapeHtml(document.getElementById('search-processos').value)}".`
                    : 'Nenhum processo encontrado nesta visão.';
                container.innerHTML = `
                    <div class="text-center py-16 px-6 text-slate-500 bg-navy-800/60 rounded-2xl border border-dashed border-slate-700">
                        <i class="fas fa-inbox text-2xl text-slate-500 mb-3"></i>
                        <p class="text-sm">${mensagem}</p>
                    </div>`;
                return;
            }

            filtered.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

            // Aplica a ordem escolhida pelo usuário (se ele já arrastou algum
            // card antes). Quem não tem posição salva continua ordenado por
            // data (o sort acima), aparecendo depois de quem já foi arrastado
            // — o sort do JS é estável, então essa ordem relativa é preservada.
            const ordemSalva = getCardOrder();
            const sortableAtivo = !searchQuery && currentActiveTab !== 'archive';
            if (sortableAtivo && ordemSalva.length) {
                const indice = new Map(ordemSalva.map((id, i) => [id, i]));
                filtered.sort((a, b) => {
                    const ai = indice.has(a.id) ? indice.get(a.id) : Infinity;
                    const bi = indice.has(b.id) ? indice.get(b.id) : Infinity;
                    return ai - bi;
                });
            }

            filtered.forEach(proc => {
                const title = proc.type === 'import' ? proc.importador : proc.exportador;
                const docRef = proc.type === 'import'
                    ? (proc.documentoTipo ? `${proc.documentoTipo}: ${proc.documentoNumero || ''}` : proc.documento)
                    : proc.booking;
                
                // Conta apenas contêineres que já têm número preenchido (ou mostra vazio)
                const validContainers = proc.containers.filter(c => c.numero !== '');
                const countBadgeText = validContainers.length > 0 ? `${validContainers.length} Unid.` : 'Pendente';
                
                const badges = validContainers.slice(0, 3).map(c => `<span class="bg-navy-900 border border-slate-700 text-slate-300 text-xs px-2 py-1 rounded-md shadow-sm">${escapeHtml(c.numero)}</span>`).join(' ');
                const extraBadges = validContainers.length > 3 ? `<span class="text-xs text-slate-500 px-1">+${validContainers.length - 3}</span>` : '';

                const draftInfo = getDraftDeadlineInfo(proc);
                const draftBadge = draftInfo
                    ? `<div class="inline-flex items-center gap-1.5 mt-2 px-2 py-1 rounded-md text-[10px] font-bold ${draftAlertConfig[draftInfo.nivel].badge}"><i class="fas ${draftAlertConfig[draftInfo.nivel].icon}"></i>${escapeHtml(draftInfo.texto)}</div>`
                    : '';

                const obsBadge = (proc.observacoes && proc.observacoes.trim())
                    ? `<div class="inline-flex items-center gap-1.5 mt-2 px-2 py-1 rounded-md text-[10px] font-bold bg-slate-500/10 text-slate-500 border border-slate-600/40" title="${escapeHtml(proc.observacoes)}"><i class="fas fa-note-sticky"></i>Observação</div>`
                    : '';

                // Agendamento de Carregamento (só existe no checklist de
                // importação, e é por contêiner): mostra o mais próximo entre
                // os contêineres do processo, se algum já estiver preenchido.
                const agCargaValores = proc.type === 'import'
                    ? proc.containers.map(c => c.checklist && c.checklist.ag_carga).filter(Boolean).sort()
                    : [];
                const agCargaTexto = agCargaValores.length > 0 ? formatarDataHoraCurta(agCargaValores[0]) : null;
                const agCargaInfo = agCargaTexto
                    ? `<div class="text-xs text-slate-500 mt-1"><i class="fas fa-calendar-check mr-1.5 opacity-50 w-3 inline-block"></i>Carreg.: ${escapeHtml(agCargaTexto)}</div>`
                    : '';

                const progress = getProcessProgress(proc);
                const progressDone = progress === 100;
                const progressColor = progressDone ? 'bg-emerald-500' : 'bg-blue-500';

                const card = document.createElement('div');
                card.className = "relative bg-navy-800 p-5 rounded-2xl shadow-lg border border-slate-700 cursor-pointer hover:border-blue-500/70 hover:shadow-xl hover:shadow-blue-900/20 hover:-translate-y-0.5 transition-all group";
                card.dataset.processId = proc.id;
                card.onclick = () => openModal(proc.id);

                card.innerHTML = `
                    ${sortableAtivo ? `<div class="card-drag-handle absolute top-2 right-2 w-6 h-6 flex items-center justify-center rounded-md text-slate-500 hover:text-slate-300 hover:bg-navy-900/60 cursor-grab active:cursor-grabbing transition-colors z-10" onclick="event.stopPropagation()" title="Arrastar para reordenar"><i class="fas fa-grip-vertical text-xs"></i></div>` : ''}
                    <div class="flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-6 w-full ${sortableAtivo ? 'sm:pr-8' : ''}">
                        <div class="sm:w-1/3 min-w-0">
                            <div class="text-[10px] text-blue-400 font-bold uppercase tracking-widest mb-1">${proc.type === 'import' ? 'Importação' : 'Exportação'}</div>
                            <div class="font-bold text-ink text-lg truncate group-hover:text-blue-400 transition-colors">${escapeHtml(title) || 'Sem Nome'}</div>

            // Ativa o arrastar-e-soltar (só na visão normal, sem busca e fora

            if (sortableAtivo && filtered.length > 1) {

        // CONTROLE DO MODAL
        window.openModal = (id) => {

            renderModalContent(proc);

            document.getElementById('process-modal').classList.remove('flex');

        // RENDERIZAR CONTEÚDO DO MODAL (INCLUI A LÓGICA DE EDIÇÃO DE CONTÊINER)
        const renderModalContent = (proc) => {
            const badge = document.getElementById('m-type-badge');

            const btnDelete = document.getElementById('btn-delete-process');
            const ctArea = document.getElementById('m-containers-area');

            badge.innerText = proc.type;
            if(proc.type === 'import') {
                title.innerText = proc.importador || 'Processo de Importação';
                const docLabel = proc.documentoTipo ? `${proc.documentoTipo}: ${proc.documentoNumero || ''}` : (proc.documento || '');
                subtitle.innerText = `${docLabel ? docLabel + ' | ' : ''}Armador: ${proc.armador} | Carga: ${proc.termCarga} | Vazio: ${proc.termVazio}`;
            } else {
                title.innerText = proc.exportador || 'Processo de Exportação';
                subtitle.innerText = `Booking: ${proc.booking} | Ref: ${proc.referencia} | Navio: ${proc.navio} | Armador: ${proc.armador}`;
            }

            // Botão/formulário de edição dos dados do cabeçalho (Booking/Ref/Navio/
            // Armador na exportação; Documento/Armador/Terminais na importação).
            // Sempre volta pro modo de visualização quando o modal é (re)renderizado.
            const btnEditHeader = document.getElementById('btn-edit-header');
            const headerEditArea = document.getElementById('m-header-edit');
            subtitle.classList.remove('hidden');
            btnEditHeader.classList.toggle('hidden', proc.status === 'archived');
            headerEditArea.classList.add('hidden');
            headerEditArea.innerHTML = proc.type === 'import' ? `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] uppercase text-slate-500 mb-1">Tipo de Documento</label>
